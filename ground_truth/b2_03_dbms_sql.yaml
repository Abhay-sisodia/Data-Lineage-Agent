# Ground truth for adversarial/band2/b2_03_dbms_sql.sql
#
# Observed with p_region = 'EU': DIM_CUSTOMER.LIFETIME_VALUE written, no value-consistent
# source - consistent with a SUM rather than a copy.
#
# THE EXPECTED ANALYSER BEHAVIOUR IS TO PRODUCE NOTHING AND SAY SO. The statement is
# assembled across four assignments and handed to an opaque handle; there is no single
# string expression to inspect and no static route to the text. This package is the
# cleanest test of the abstention classifier in the corpus precisely because it is
# trivial to PARSE and impossible to RESOLVE - the two are not the same thing, and a
# parser that conflates them will emit something confident here.
#
# The edges below are nevertheless real. Labelling them keeps band-2 recall honest: the
# gap is a genuine gap, recoverable only from the query log, and pretending the lineage
# does not exist would flatter the number by redefining the question.

