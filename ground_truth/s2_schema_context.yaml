# Ground truth for adversarial/silent/s2_schema_context.sql
#
# PARSE-ONLY. reporting.stg_customer is a schema deliberately never created, so this file
# is not compiled and nothing here is observed. Every label is source_read.
#
# THE FAILURE THIS CASE DESCRIBES CANNOT BE SEEN IN ONE RUN. An unqualified name resolves
# through the EXECUTING USER's schema, so the same procedure run by two jobs touches two
# different tables. A single observation would show one of them and look definitive -
# which is precisely how this becomes a silent failure rather than a loud one. The
# evidence that resolves it is V$SQL's parsing_schema_name, per execution, not a global
# default chosen once at ingest.
#
# So the first statement's labels below are conditional on the execution schema being
# LINEAGE. That condition is part of the fact, not a footnote to it.

