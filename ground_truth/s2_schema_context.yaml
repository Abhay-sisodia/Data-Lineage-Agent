# NO FORBIDDEN EDGES HERE, AND THE REASON IS ITSELF A FINDING.
#
# The wrong answer this package invites is statement 2 bound against the LOCAL
# stg_customer - dropping the unresolvable qualifier and matching the remainder to a
# table we do hold. That is the most dangerous repair available to an analyser here: it
# silently merges a refused schema into one we own.
#
# It cannot be expressed as a forbidden edge, because the resulting edge is
# `STG_CUSTOMER.CUST_ID -> TMP_RECENT.CUST_ID` - character for character the same as
# statement 1's legitimate edge. The v0 match key is (source, target, flow, transform)
# and carries no origin, so the same key is correct from line 19 and fabricated from
# line 26.
#
# This is ADR-0001 amendment 1 arriving from a third direction: b1_03 needed guard in the
# key, b1_09 needed origin, and this package needs origin too. Three independent cases now
# say the match key is under-specified. Recorded here rather than worked around, because
# a forbidden rule that contradicts a required edge would make the package unscoreable -
# the label validator rejects exactly that.
#
# SUPERSEDED IN PART, 2026-09-09 — ADR-0001 amendment 1c.
#
# "It cannot be expressed as a forbidden edge" is still true, and the conclusion drawn from
# it — that the match key must carry origin — was built and MEASURED and rejected
# (amendment 1b: it caught nothing and cost five false positives, because one true fact
# legitimately arrives from several units). What this package actually needed was never a
# key change. It was an assertion about DERIVATION, and `origin_assertions` below is it:
# statement 1's edges must come from statement 1's lines, so the identical edge arriving
# from line 26 is reported by name rather than absorbed.
#
# What CAN be checked today is the boundary below: if the analyser declares the refused
# schema, it did not silently absorb it.
#
# AND TODAY IT DOES NOT. Measured 2026-09-09: this package declares ZERO boundaries, raises
# ZERO refusals, and reports 2 statements seen and 2 ANALYSED — while emitting no edge at
# all for statement 2. The ungranted schema is dropped with no symptom anywhere, and the
# statement is counted as analysed, so it inflates parse coverage too. That is the silent
# absorption this package exists to catch, in its purest form. Recorded here rather than
# fixed in passing: see the boundary-representation finding.

# WHERE THESE EDGES ARE ALLOWED TO COME FROM (ADR-0001 amendment 1c).
#
# The trap: statement 2 binds `reporting.stg_customer` to the LOCAL stg_customer by dropping
# a qualifier it could not resolve, producing an edge character-for-character identical to
# statement 1's legitimate one. Only the line differs.
#
# Lines 17-22 are statement 1, from its comment to its terminating semicolon. The range is
# deliberately wider than any single line because the analyser attributes an INSERT ...
# SELECT to the INSERT (line 18) while this key was hand-read at the SELECT (19-20) - a
# disagreement with nothing to do with lineage being right, and exactly why the match key
# must not carry line numbers. It is safe HERE because `source_sha256` pins the file: the
# harness refuses to score this key if the source moves under it, so 17-22 cannot silently
# come to mean a different statement.
origin_assertions:
  - source: {kind: column, name: STG_CUSTOMER.CUST_ID}
    target: {kind: column, name: TMP_RECENT.CUST_ID}
    flow: value
    must_come_from: [{unit: S2_SCHEMA_CONTEXT, lines: [17, 22]}]
    reason: >
      Statement 2 selects cust_id from reporting.stg_customer, a schema that was never
      granted. Binding it to the local stg_customer produces this exact edge from line 26.
      The edge is right; the derivation is a refused schema silently merged into one we own.

  - source: {kind: column, name: STG_CUSTOMER.LAST_LOGIN}
    target: {kind: column, name: TMP_RECENT.LAST_LOGIN}
    flow: value
    must_come_from: [{unit: S2_SCHEMA_CONTEXT, lines: [17, 22]}]
    reason: >
      The same fabrication as cust_id, on the other projected column. Both must be asserted
      or the trap is only half covered.

  - source: {kind: column, name: STG_CUSTOMER.LAST_LOGIN}
    target: {kind: relation, name: TMP_RECENT}
    flow: filter
    must_come_from: [{unit: S2_SCHEMA_CONTEXT, lines: [17, 22]}]
    reason: >
      `WHERE last_login IS NOT NULL` appears in both statements, so the filter edge is
      fabricable from line 27 exactly as the value edges are from line 26.

