#
#   b1_nested_calls
#     -> fn_net_amount(order_id)          reads stg_orders.gross_amount
#          -> fn_discount_rate(order_id)  reads stg_orders.discount_amt and gross_amount
#
# Call depth 3, inside the default cap of 6.
#
# Without inlining the callee summaries, fct_revenue.net_amount appears to come from
# nowhere: a function call with no visible source. That is the failure this case detects -
# not a wrong edge, but a regulated column with no traceable origin.
#
# Observed: FCT_REVENUE 0 -> 3 rows. NET_AMOUNT reported no value-consistent source,
# which is correct - it is computed, so its values appear nowhere upstream.

