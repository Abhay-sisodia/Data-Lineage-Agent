    band: 1
    origin: {unit: B1_NESTED_CALLS, line: 42}
    evidence: observed
    note: >
      Two levels down, inside fn_discount_rate. An analyser that summarises only the
      immediate callee stops one level short and silently loses this edge.

      CORRECTED 2026-09-06, derived -> conditional. Written as `derived` without tracing
      into the callee. fn_discount_rate is
      `CASE WHEN gross_amount = 0 THEN 0 ELSE discount_amt/gross_amount END`, so
      discount_amt contributes ONLY when gross_amount is non-zero. That is exactly what
      the conditional class means, and calling it derived claims an unconditional
      contribution it does not make.

      Raises agreement with the analyser, so flagged. The justification is the callee's
      source, which predates the analyser being able to read it.

