# Ground truth for adversarial/band1/b1_05_explicit_cursor.sql
#
# THE POSITIONAL BINDING TRAP.
#
#   CURSOR c_cust IS SELECT cust_id, email, region FROM stg_customer ...
#   FETCH c_cust INTO v_id, v_email, v_region;
#
# The fetch targets bind BY POSITION. The variable names happen to line up here, which
# is precisely what makes the trap dangerous: an analyser that matches on name gets the
# right answer on this code and the wrong answer on code where they do not align, with
# no symptom either way.
#
# The correct binding is:
#   position 1  cust_id -> v_id
#   position 2  email   -> v_email
#   position 3  region  -> v_region
#
# Observed only after nulling dim_customer.email and region first. Run directly, this
# procedure changes nothing at all - it writes values identical to those already there.
# Both source columns were then uniquely value-consistent.

