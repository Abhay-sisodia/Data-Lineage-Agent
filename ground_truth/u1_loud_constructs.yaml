  - "U1_MATCH_RECOGNIZE: line 48 refused [UNSUPPORTED_CONSTRUCT] - MATCH_RECOGNIZE"
  - "U1_PIVOT_SUBQUERY: line 68 refused [SHAPE_NOT_DECIDABLE] - PIVOT with a subquery column list"
  - "U1_HIERARCHICAL: line 79 refused [UNSUPPORTED_CONSTRUCT] - CONNECT BY"
  - "U1_CONDITIONAL_COMPILATION: lines 95-101 refused [CONTEXT_DEPENDENT] - $IF block, both arms"
  - "U1_XMLTABLE: line 110 refused [SHAPE_NOT_DECIDABLE] - XMLTABLE"
  - "U1_WRAPPED: line 136 refused [SOURCE_UNAVAILABLE] - wrapped PL/SQL"
  - "U1_WRAPPED: the wrapped blob is not valid PL/SQL, so the grammar derails on it and every unit declared after it is lost - which is why the control sits above it"
