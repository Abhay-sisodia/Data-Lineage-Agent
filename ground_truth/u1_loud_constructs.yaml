# THE NAMED WRONG ANSWERS.
#
# Every construct here parses into something that LOOKS like an ordinary projection, which
# is why refusing them has to be deliberate. Three of the four below were measured, not
# imagined - the analyser produced them before the classifier gated it.

forbidden:
  - source: {kind: column, name: DIM_CUSTOMER_HIER.CUST_ID}
    target: {kind: column, name: DIM_CUSTOMER_HIER.CUST_ID}
    flow: value
    transform: identity
    reason: >
      MEASURED. Before the classifier gated the analyser, CONNECT BY produced three
      self-edges exactly like this one. It is indistinguishable from a legitimate
      self-referential copy, and it is wrong: the row it copies from is at an arbitrary
      depth in a hierarchy the statement walks at runtime, so "cust_id came from cust_id"
      states a one-hop fact about an unbounded traversal.

  - source: {kind: column, name: DIM_CUSTOMER_HIER.ROOT_NAME}
    target: {kind: column, name: DIM_CUSTOMER_HIER.ROOT_NAME}
    flow: value
    transform: identity
    reason: >
      MEASURED, and worse than the one above. CONNECT_BY_ROOT root_name returns the value
      from the top of the tree, not from this row. Identity is the one transform class it
      certainly is not, and ADR-0001 4 makes a wrong transform class a MISS rather than a
      near miss.

  - source: {kind: column, name: FCT_REVENUE_STAGE.NET_AMOUNT}
    target: {kind: column, name: FCT_REVENUE.NET_AMOUNT}
    flow: value
    transform: identity
    reason: >
      The MODEL clause's select list says net_amount, and the rule beneath it says
      net_amount[ANY] = net_amount[CV(period_month)] * 1.1. Reading the projection and
      stopping there gives an edge with the right endpoints and the wrong transform - the
      most dangerous shape a false positive can take, because the endpoints are what a
      reviewer checks.

  - source: {kind: column, name: STG_CUSTOMER.CUST_ID}
    target: {kind: column, name: DW_AUDIT_LOG.CUST_ID}
    flow: value
    transform: identity
    reason: >
      MEASURED. The $IF arm of u1_conditional_compilation. The analyser emitted BOTH arms
      before spans were refused, which is two contradictory answers stated as fact - and
      the file cannot say which one exists in the compiled unit, because PLSQL_CCFLAGS
      decides that and it is not in the file.

# TWO WRONG ANSWERS THAT CANNOT BE WRITTEN DOWN, AND THE REASON IS THE FINDING.
#
# The $ELSE arm of the conditional compilation is
#     STG_CUSTOMER.CUST_ID -> TMP_RECENT.CUST_ID [value/identity]
# and so is the naive reading of the XMLTABLE, which binds x.cust_id straight back to the
# table in the same FROM clause. Both are character for character the CONTROL's required
# edge, differing only in origin - line 96 or line 110 rather than line 125.
#
# The label validator rejects a key that both requires and forbids the same edge, correctly:
# such a package is unscoreable in a way no number reveals. So they are recorded here.
#
# This is now the SIXTH package to say the v0 match key is under-specified - after s2,
# b2_05, b1_09 (origin) and b1_03, s7 (guard). It is the strongest instance yet, because
# here the right answer and the wrong answer are produced by the same analyser on the same
# run and only the line number separates them.

boundaries:
