# Ground truth for adversarial/unanalysable/u1_loud_constructs.sql
#
# PARSE-ONLY. Nothing here is compiled - MODEL, MATCH_RECOGNIZE and XMLTABLE all reference
# shapes the seed schema does not carry, and the point of the file is what the analyser
# SAYS about them rather than what the database does with them. Every label is source_read.
#
# THIS KEY IS MOSTLY BOUNDARIES, AND THAT IS THE DELIVERABLE. Seven of the eight procedures
# must produce nothing at all. An answer key whose main assertion is an absence sounds
# weak, so it is worth being exact about what is being asserted: not "we found nothing
# here", which is what a broken analyser also reports, but "we named the construct, gave
# it a code, and emitted no edge from its line" - which a broken analyser cannot fake.
#
# The two halves are scored by different machinery on purpose. The edges below are scored
# like any other package's. The refusals are scored by the cross-check in T3.1c: for every
# flagged statement, the edge set produced from it must be empty. Neither check subsumes
# the other, and a package that passed one while failing the other would look fine.

package: adversarial/unanalysable/u1_loud_constructs.sql
