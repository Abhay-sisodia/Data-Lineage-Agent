# Ground truth for adversarial/silent/s4_partition_exchange.sql
#
# OBSERVED, AND THE OBSERVATION IS THE ARGUMENT. After one run:
#
#   FCT_REVENUE_PART   0 -> 3 rows      (all four columns written)
#   FCT_REVENUE_STAGE  3 -> 0 rows      (verified directly afterwards)
#
# There is no INSERT anywhere in this file targeting fct_revenue_part. A fully populated,
# partitioned, regulated-looking fact table acquired its entire contents through an ALTER
# TABLE, and a DML-only analyser reports it as having no writer at all.
#
# "No writer" is the worst possible wrong answer, worse than a missing edge: it reads as a
# positive finding. An auditor asking who populates this table gets silence that looks
# like an answer.
#
# TWO SEPARATE DIFFICULTIES, AND THEY NEED DIFFERENT REMEDIES:
#   1. The exchange is DDL. Lineage must treat DDL in the log as lineage-bearing.
#   2. The DDL is inside EXECUTE IMMEDIATE, so it is also band-2 dynamic SQL - though of
#      the constant-string kind, which makes it statically recoverable like b2_01.
#
# BANDING. The staging load is band 0 - a plain INSERT ... SELECT. The exchange edges are
# band 2: the hardest construct on their path is dynamic DDL.

