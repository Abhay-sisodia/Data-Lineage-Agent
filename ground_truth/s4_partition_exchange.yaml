forbidden:
  - source: {kind: column, name: STG_ORDERS.GROSS_AMOUNT}
    target: {kind: column, name: FCT_REVENUE_PART.NET_AMOUNT}
    flow: value
    reason: >
      The composed shortcut. It is arguably TRUE in the end-to-end sense, and it is still
      forbidden here, because emitting it directly skips the exchange and therefore
      reports the wrong mechanism, the wrong origin and the wrong evidence tier for a hop
      that no INSERT performed. Path composition is a query-time operation over hops that
      each stand on their own evidence; collapsing two hops into one claim at emission
      time is how an unprovable edge acquires a provable-looking origin.

