# Ground truth for adversarial/band2/b2_05_triggers.sql
#
# Observed: TMP_RECENT.CUST_ID and LAST_LOGIN written (0 -> 2 rows), and
# DIM_CUSTOMER.LIFETIME_VALUE written - by a procedure whose source never mentions
# dim_customer at all.
#
# This is the package that defines the band-2 trigger gap, and the eleven trigger edges
# scattered across the other keys all trace back to the two triggers declared here.
#
# BANDING. The caller's own INSERT ... SELECT is band 0: the path traverses no variable,
# branch, loop, cursor or call, and the corrected banding rule from T2.0 says a plain
# projection inside procedural code stays band 0. Only the trigger-borne edges are band 2.
# Getting this wrong in either direction distorts a measurement: band 0 would inherit a
# construct its analyser is not meant to handle, or band 2 would collect two free wins.

