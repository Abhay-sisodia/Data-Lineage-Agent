  # --- trg_customer_default is NOT labelled here, and that is the correction -----------
  #
  # REMOVED 2026-09-07. It raises this package's recall by dropping two misses, so it is
  # stated plainly.
  #
  # This key originally carried trg_customer_default's two edges because the trigger is
  # DECLARED in this file. That is exactly the mistake the whole task exists to correct: a
  # trigger belongs to its TABLE, not to whichever source file happens to hold its text.
  # trg_customer_default fires BEFORE INSERT ON dim_customer, and nothing in b2_triggers
  # inserts into dim_customer, so it never fires here.
  #
  # Where it does belong is b0_02, whose MERGE has an insert arm on dim_customer - and
  # that key has carried the edge, correctly banded and marked unexercised, since week 1.
  # The duplicate here was the artefact.
  #
  # Keeping it would have made this package score well for the wrong reason: an analyser
  # that read triggers out of the local file rather than the dictionary would match it,
  # and would then miss the same trigger for every other writer of dim_customer.

forbidden:
  - source: {kind: column, name: STG_CUSTOMER.CUST_ID}
    target: {kind: column, name: DIM_CUSTOMER.LIFETIME_VALUE}
    flow: value
    reason: >
      The plausible fusion. stg_customer feeds tmp_recent and the trigger reads tmp_recent,
      so composing the two paths inside one procedure produces a direct edge from the
      staging table to the regulated column. It is wrong for the reason s3 exists: the
      trigger fires per inserted row of tmp_recent, and lifetime_value is derived from its
      OWN prior value, not from anything stg_customer supplied.

# THE OTHER FAILURE IN THIS PACKAGE CANNOT BE A FORBIDDEN EDGE EITHER.
#
# Attaching the trigger's edges to the CALLER rather than to the table is wrong twice
# over: it credits b2_triggers with a write it never issued, and it misses every other
# procedure that inserts into tmp_recent - of which this corpus has six. But the resulting
# edge has the same source, target, flow and transform as the correct one. Only the origin
# differs, and the v0 match key does not carry origin.
#
# So a correct-looking 100% here would be consistent with the design error the register
# warns about most explicitly. T3.3 has to assert the origin directly.

