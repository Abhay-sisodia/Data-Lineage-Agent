  #
  # RE-LABELLED 2026-09-10 under stress finding S2-12, decision D-4. These four were three
  # `filter` edges against `relation:FCT_PRODUCT_SALES`. Two things were wrong with that
  # and the second is the one that matters:
  #
  #   * A WINDOW FUNCTION REMOVES NO ROWS. Every input row survives it, so an edge saying
  #     order_date decided which rows landed in fct_product_sales was false. `filter` was
  #     carrying two different meanings - "decided which rows landed" and "decided which
  #     value a surviving row got" - and only the first is what the flow means.
  #   * The target was the RELATION, which threw away the useful half. "Something about
  #     this table depends on order_date" is a much weaker statement than "rank_in_month
  #     depends on order_date", and the second is what is actually true.
  #
  # THE STRESS KEYS DISAGREED WITH THIS KEY AND NOBODY NOTICED. Neither stress package
  # labelled these at all, so the same analyser behaviour scored as correct here and as a
  # false positive there, for two stress runs. That is the S2-11 shape: a convention held
  # by one key and not another, invisible because both sides look like ordinary
  # disagreements in the grid.
  #
  # Three labels became four. `ORDER_DATE -> PRIOR_MONTH` is LAG's own ORDER BY and was
  # missing - the same omission the 2026-09-06 completion note below describes for LAG's
  # PARTITION BY, found the same way and stated the same way.

