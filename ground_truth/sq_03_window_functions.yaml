# Ground truth for adversarial/sql/sq_03_window_functions.sql
#
# MODELLING DECISION, made here for the first time and applied consistently.
#
# A window function has three kinds of column reference and they are NOT the same fact:
#
#   * the argument      LAG(total)              -> a value source
#   * PARTITION BY      period_month            -> influence, not value
#   * ORDER BY          total DESC              -> influence, not value
#
# ROW_NUMBER() takes no argument at all, so rank_in_month has NO value edge - the same
# rule as COUNT(*) in b0_05, where a row count has no source column. What decides the
# rank is the partitioning and ordering, and those are filter-shaped influence.
#
# Treating PARTITION BY and ORDER BY columns as value sources would claim that a date
# determines a rank's VALUE, which is the same category error as treating a correlated
# predicate as a value source.
#
# LAG is the interesting one: prior_month's value comes from ANOTHER ROW of `total`. The
# column lineage is still line_amount - lineage tracks which column, not which row.
#
# Observed: all six columns written. RANK_IN_MONTH offered only low-cardinality integer
# candidates, consistent with a value computed rather than copied.

