# Ground truth for adversarial/band1/b1_07_package_variables.sql
#
# Established per ADR-0001 §1: the database is the referee. Targets marked `observed`
# were confirmed by executing the package and watching which columns changed
# (scripts/observe_corpus.py). Sources were then ruled on by a human against the
# value-consistency evidence.
#
# WHAT OBSERVATION SETTLED, AND WHAT IT DID NOT
#
#   TMP_RECENT.CUST_ID / LAST_LOGIN       written - definitive
#   DIM_CUSTOMER.LIFETIME_VALUE           written - definitive, and NOT visible anywhere
#                                         in this package's source (see trigger note)
#   STG_CUSTOMER.LAST_LOGIN as a source   uniquely value-consistent - strong evidence
#   STG_CUSTOMER.CUST_ID as a source      matched 6 candidate columns; low-cardinality
#                                         integers match almost anything, so this was
#                                         ruled by reading line 36, not by observation
#   Package variables G_WINDOW_DAYS,      invisible to observation entirely - they are
#   G_CUTOFF                              session memory, never touch a table
#
# THE TRIGGER FINDING
#
# DIM_CUSTOMER.LIFETIME_VALUE is written by TRG_RECENT_AUDIT (defined in
# adversarial/band2/b2_05_triggers.sql), which fires on INSERT INTO tmp_recent. Nothing
# in b1_07 hints at it. Those edges are included here because they are REAL lineage that
# genuinely occurs when this package runs, and omitting real lineage from an answer key
# is exactly the silent hole the product exists to prevent.
#
# Consequence, stated up front: recall will be understated until the analyser attaches
# trigger edges to the table rather than the caller. That is honest measurement, not a
# broken benchmark.

# BANDING CORRECTION — 2026-09-06, before any band-1 number was produced
#
# Two value edges here were originally labelled band 1 because they live inside a
# procedural package. That was wrong, and wrong in the flattering direction.
#
# ADR-0001 6 bands an edge by the hardest construct ON THAT EDGE'S PATH. The path for
# stg_customer.cust_id -> tmp_recent.cust_id is an ordinary projection inside an
# INSERT ... SELECT. No variable, no branch, no call. It is a band-0 edge that happens
# to be written inside a package.
#
# Leaving them as band 1 would have padded the band-1 score with band-0 wins and made
# the procedural analysis look better than it is - which is the specific self-deception
# this phase exists to avoid. The rule, applied to every band-1 label set from here:
#
#   band 1 = the edge's path traverses a VARIABLE, BRANCH, LOOP, CURSOR or CALL
#   band 0 = plain projection or predicate, even inside procedural code
#
# This makes band 1 harder to score well on. That is the point.

