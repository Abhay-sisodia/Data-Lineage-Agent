    evidence: source_read
    note: >
      The column side of `EXTRACT(MONTH FROM order_date) = i`.

      CORRECTED 2026-09-06, rebanded 1 -> 0. This edge was originally labelled band 1 on
      the reasoning that "the loop counter selects which rows are summed" - but that is a
      statement about the OTHER operand. This edge's own path traverses no variable, so
      by the banding rule it is band 0. The loop counter's influence is a separate edge,
      added below. Conflating two operands into one edge lost a real fact and mis-banded
      the one that remained.

  - source: {kind: variable, name: I}
    target: {kind: relation, name: STG_ORDERS}
