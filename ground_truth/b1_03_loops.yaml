    band: 1
    origin: {unit: B1_LOOPS, line: 15}
    evidence: source_read
    note: >
      The self-edge that makes this a fixed-point problem. An analyser that misses it
      reports an accumulation one iteration deep.

      Occurs TWICE in this procedure - the accumulation at line 15 and the decay at
      line 32 (`v_total := v_total / 2`) - and the v0 edge key cannot distinguish them,
      since both are (V_TOTAL, V_TOTAL, value, derived). Same model limitation as
      recorded in b1_09; T2.1 should make guard and origin part of ledger identity while
      keeping them out of precision matching. This file under-counts by one edge.

  - source: {kind: column, name: STG_ORDERS.ORDER_DATE}
