    note: >
      ADDED 2026-09-06. The loop counter genuinely decides which month's rows are summed
      on each pass - the same kind of fact as `p_region` selecting a policy row. A FOR
      index is an implicitly declared variable, and omitting it lost the band-1 half of
      this predicate entirely.

