# Ground truth for adversarial/band1/b1_03_loops.sql
#
# Two loops. The first accumulates a value across twelve iterations through a variable;
# the second writes a table each pass, filtered by that same variable as it decays.
#
# Observed: FCT_REVENUE 0 -> 8 rows (the WHILE loop ran more than once, which is what
# makes fixed-point iteration necessary rather than decorative), and
# DIM_CUSTOMER.LIFETIME_VALUE written with no value-consistent source - correct, since
# it is an accumulated sum that exists nowhere upstream.
#
# The genuinely hard part: v_total is DEFINED inside the loop from a value that includes
# its own previous value. A single pass of def-use analysis sees only one definition
# reaching the use; the loop means the definition also reaches ITSELF. Analysis has to
# iterate to a fixed point or it will report a chain that is one iteration deep and
# quietly wrong.

