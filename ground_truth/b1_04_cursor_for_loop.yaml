# Ground truth for adversarial/band1/b1_04_cursor_for_loop.sql
#
# Row values become record fields become an UPDATE. The cursor's SELECT is the real
# source, but every value reaches the target through `rec.<field>` - which no SQL parser
# connects to anything, because `rec` is not a relation.
#
# Observed twice:
#   * directly: IS_ACTIVE written
#   * with dim_customer.email nulled first: EMAIL written, uniquely value-consistent
#     with STG_CUSTOMER.EMAIL
#
# The second run was necessary because dim_customer.email already equalled
# stg_customer.email on the seed data, making the write idempotent and invisible. Every
# edge here would have been source_read without that setup.
#
# Everything is band 1: there are no plain projections in this package. Every value
# passes through the record variable.

