# Ground truth for adversarial/silent/s5_positional_union.sql
#
# PROVED BY THE DATA, not by reading the SQL standard. After a run against an emptied
# tmp_recent:
#
#   tmp_recent.cust_id  = [1, 2, 3, 4, 100, 101, 102]
#   stg_customer.cust_id = [1, 2, 3, 4]
#   stg_orders.order_id  = [100, 101, 102]
#
# col_a carries order_id, exactly as position dictates and exactly opposite to what the
# aliases say. The alias on arm 2 calls it col_b; SQL ignores that entirely.
#
# WHY THIS IS SILENT RATHER THAN LOUD. The types line up in POSITION order - (NUMBER,
# DATE) in both arms - so Oracle accepts the statement without complaint. An earlier
# version of this case reversed the types as well and was simply rejected by the
# compiler, which would have tested nothing: a loud failure announces itself. The whole
# point is that this compiles, runs, and produces plausible output with only the lineage
# wrong.
#
# The name-matched answer is not merely wrong, it is impossible: it would put order_date,
# a DATE, into cust_id, a NUMBER. An analyser producing it has contradicted the schema it
# already holds - which makes this case a test of whether resolution is checked against
# the dictionary or merely assumed.

