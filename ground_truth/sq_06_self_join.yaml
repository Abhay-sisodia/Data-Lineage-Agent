# Ground truth for adversarial/sql/sq_06_self_join.sql
#
# KNOWN MODEL LIMITATION, stated before the analyser was run.
#
# dim_customer_hier appears twice, as `child` and `parent`. Those are different ROWS of
# the same relation, and our node names carry no alias - `column:DIM_CUSTOMER_HIER.CUST_ID`
# is the same node whichever side it came from. So:
#
#   child.cust_id  -> dim_customer_hier.cust_id        (a self-edge)
#   parent.cust_id -> dim_customer_hier.parent_cust_id
#
# collapse into indistinguishable facts about the same column, and the first is a
# self-edge that reads as circular. The lineage is genuinely self-referential here, but
# the model cannot express WHICH side fed which target.
#
# This is the join-side analogue of the shared temp table problem, and it is the same
# class of gap as ADR-0001 amendment 1: identity needs more than the column name. Not
# fixed here; recorded so the score is read correctly.
#
# The scalar subquery in the select list adds the second difficulty: its WHERE correlates
# back to the outer query, so those columns are filter influence, not value sources -
# the same rule established in b1_02.

