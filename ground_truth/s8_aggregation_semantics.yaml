labelled_by: claude+abhay (targets observed; transform classes source_read - see above)
labelled_at: "2026-09-06"

note: >
  The identity/aggregated distinction is NOT observation-anchored on this seed data, and
  it is the distinction the package exists to test. Read those two labels accordingly.

edges:
  # --- s8_identity_copy: one row in, one row out --------------------------------------

  - source: {kind: column, name: STG_ORDERS.CUST_ID}
    target: {kind: column, name: FCT_REVENUE.CUST_ID}
    flow: value
    transform: identity
    band: 0
    origin: {unit: S8_IDENTITY_COPY, line: 20}
    evidence: observed

  - source: {kind: column, name: STG_ORDERS.ORDER_DATE}
    target: {kind: column, name: FCT_REVENUE.PERIOD_MONTH}
    flow: value
    transform: identity
    band: 0
    origin: {unit: S8_IDENTITY_COPY, line: 21}
    evidence: observed
    note: >
      No truncation in this procedure - the raw order_date lands in period_month. That
      alone is a discrepancy worth surfacing, and lineage surfaces it without ruling on it.

  - source: {kind: column, name: STG_ORDERS.GROSS_AMOUNT}
    target: {kind: column, name: FCT_REVENUE.NET_AMOUNT}
    flow: value
    transform: identity
    band: 0
    origin: {unit: S8_IDENTITY_COPY, line: 22}
    evidence: source_read
    note: >
      Target observed and value-consistent, but the TRANSFORM CLASS is source_read: this
      seed data cannot distinguish a copy from a sum. See the header.

  # order_count receives the literal 1 - no edge.

  # --- s8_aggregated_copy: many rows collapse into one --------------------------------
  #
  # cust_id -> cust_id and gross_amount -> net_amount would duplicate the keys above
  # under the v0 match key if they carried the same transform. They do not: the transform
  # class is what separates them, which is exactly ADR-0001 4 doing its job. This is the
  # one place in the corpus where transform alone carries edge identity.

  - source: {kind: column, name: STG_ORDERS.GROSS_AMOUNT}
    target: {kind: column, name: FCT_REVENUE.NET_AMOUNT}
    flow: value
    transform: aggregated
    band: 0
    origin: {unit: S8_AGGREGATED_COPY, line: 36}
    evidence: source_read
    note: SUM(gross_amount) over a customer-month group. Transform class read from source.

  - source: {kind: column, name: STG_ORDERS.ORDER_DATE}
    target: {kind: column, name: FCT_REVENUE.PERIOD_MONTH}
    flow: value
    transform: derived
    band: 0
    origin: {unit: S8_AGGREGATED_COPY, line: 35}
    evidence: observed
    note: TRUNC(order_date, 'MM') - derived, and distinct from the identity copy above.

  - source: {kind: column, name: STG_ORDERS.CUST_ID}
    target: {kind: relation, name: FCT_REVENUE}
    flow: filter
    transform: identity
    band: 0
    origin: {unit: S8_AGGREGATED_COPY, line: 39}
    evidence: source_read
    note: >
      GROUP BY cust_id. Grouping decides which rows collapse together, which is influence
      over WHICH row rather than over the value - the same treatment as a window function's
      PARTITION BY, fixed in the complex-SQL band. Consistency across the two matters more
      than either choice on its own.

  # order_count is COUNT(*) and gets no edge in either procedure.

  # --- s8_conditional_copy: the value depends on a branch inside the expression --------

  - source: {kind: column, name: STG_ORDERS.GROSS_AMOUNT}
    target: {kind: column, name: FCT_REVENUE.NET_AMOUNT}
    flow: value
    transform: conditional
    band: 0
    origin: {unit: S8_CONDITIONAL_COPY, line: 51}
    evidence: observed
    note: >
      The one transform class this seed data DOES prove: the USD conversion changed the
      values, so no value-consistent source was found - which is what a conditional
      transform looks like from the outside and what a copy never looks like.

  - source: {kind: column, name: STG_ORDERS.CURRENCY}
    target: {kind: column, name: FCT_REVENUE.NET_AMOUNT}
    flow: value
    transform: conditional
    band: 0
    origin: {unit: S8_CONDITIONAL_COPY, line: 51}
    evidence: source_read
    note: >
      currency decides WHICH arm of the CASE runs, and the arms compute different values,
      so it genuinely participates in the value. This is the boundary case against the
      correlated-predicate rule: a predicate that selects a row is filter influence, but a
      predicate that selects an EXPRESSION is a value source.

  # === GROUP BY influence, added 2026-09-11 under stress finding S1-03, decision D-2 ===
  #
  # A GROUP BY removes no rows - it decides which rows collapse together - so it is not a
  # filter. What it decides is the VALUE of every aggregated output column: change the
  # grouping and SUM(amount) changes, while no part of cust_id is in the number. That is
  # `Flow.INFLUENCE`, the flow D-4 created for the window case, reused here for the same
  # reason and for the same target - the COLUMN, not the relation.
  #
  # ONLY AGGREGATED COLUMNS ARE INFLUENCED. The grouping keys are usually projected too, and
  # their values are copied through untouched; emitting influence onto one would say a
  # column decides its own value.
  #
  # These are NEW labels for a construct the analyser never read before D-2, not a
  # re-tagging of existing ones. `args.get("group")` appeared nowhere in the source until
  # now, which is why S1-03's premise - "GROUP BY columns emitted as filter edges" - was
  # false for three stress runs.
  #
  # Derived by applying the rule to this package's GROUP BY and its aggregated projections,
  # checked clause by clause against the source. Band and guard follow this key's existing
  # labels for the same statement rather than being restated.

  - source: {kind: column, name: STG_ORDERS.CUST_ID}
    target: {kind: column, name: FCT_REVENUE.NET_AMOUNT}
    flow: influence
    transform: identity
    band: 0
    origin: {unit: S8_AGGREGATED_COPY, line: 33}
    evidence: source_read
  - source: {kind: column, name: STG_ORDERS.CUST_ID}
    target: {kind: column, name: FCT_REVENUE.ORDER_COUNT}
    flow: influence
    transform: identity
    band: 0
    origin: {unit: S8_AGGREGATED_COPY, line: 33}
    evidence: source_read
  - source: {kind: column, name: STG_ORDERS.ORDER_DATE}
    target: {kind: column, name: FCT_REVENUE.NET_AMOUNT}
    flow: influence
    transform: identity
    band: 0
    origin: {unit: S8_AGGREGATED_COPY, line: 33}
    evidence: source_read
  - source: {kind: column, name: STG_ORDERS.ORDER_DATE}
    target: {kind: column, name: FCT_REVENUE.ORDER_COUNT}
    flow: influence
    transform: identity
    band: 0
    origin: {unit: S8_AGGREGATED_COPY, line: 33}
    evidence: source_read

forbidden:
  - source: {kind: column, name: STG_ORDERS.GROSS_AMOUNT}
    target: {kind: column, name: FCT_REVENUE.ORDER_COUNT}
    flow: value
    reason: >
      COUNT(*) has no source column. Attaching the nearest column in the select list is a
      standing temptation for an analyser that wants every target to have a source, and it
      manufactures a lineage claim out of nothing.

  - source: {kind: column, name: STG_ORDERS.CURRENCY}
    target: {kind: relation, name: FCT_REVENUE}
    flow: filter
    reason: >
      currency inside a CASE is not a row filter - the statement selects every row of
      stg_orders regardless of it. Reporting it as a filter would be the mirror image of
      the correlated-predicate error: influence classified as the wrong KIND of influence
      rather than invented outright. Both make the edge a different fact than it is.

