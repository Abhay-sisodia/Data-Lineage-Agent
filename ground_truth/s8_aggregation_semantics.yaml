# Ground truth for adversarial/silent/s8_aggregation_semantics.sql
#
# Three procedures write the SAME pair of endpoints - stg_orders.gross_amount ->
# fct_revenue.net_amount - and the three edges mean entirely different things. One copies
# a row's value. One sums a whole customer-month. One applies a currency conversion on a
# branch. To anyone reading a filing those are three different facts, and the only thing
# separating them is the transform class.
#
# THE FINDING FROM OBSERVING IT, AND IT IS A LIMIT OF THE REFEREE ITSELF.
#
# Each procedure was observed against an emptied fct_revenue:
#
#   s8_identity_copy    -> 3 rows, NET_AMOUNT value-consistent with STG_ORDERS.GROSS_AMOUNT
#   s8_aggregated_copy  -> 3 rows, NET_AMOUNT value-consistent with STG_ORDERS.GROSS_AMOUNT
#   s8_conditional_copy -> 3 rows, NET_AMOUNT with NO value-consistent source
#
# The first two outputs are INDISTINGUISHABLE. The seed data holds three orders in three
# distinct customer-months, so every GROUP BY group has exactly one row and SUM(x) = x.
# Row counts match, values match, candidate sources match.
#
# So observation - the referee this whole answer key rests on - cannot separate identity
# from aggregated here, and ADR-0001 4 makes a wrong transform class a MISS rather than
# partial credit. Those two labels are therefore source_read and NOT observed, and the
# provenance split will say so on every score. Upgrading them because the analyser agreed
# would be exactly the self-certification the observation harness exists to prevent.
#
# A denser corpus would separate them. That is a corpus improvement worth making and it is
# not made here, because discovering the limit is more useful than papering over it.

package: adversarial/silent/s8_aggregation_semantics.sql
