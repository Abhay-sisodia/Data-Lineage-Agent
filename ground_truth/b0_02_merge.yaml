# Ground truth for adversarial/band0/b0_02_merge.sql
#
# THE ONE PACKAGE OBSERVATION COULD NOT SETTLE.
#
# Running b0_merge changed nothing at all. That is not a harness bug and not a no-op:
# every row matched, and the UPDATE arm set email and region to the values they already
# held. An idempotent write is invisible to before/after comparison in principle, not
# just in this implementation.
#
# So every edge here is `source_read` - the weakest provenance in the set - and the
# evidence split printed with any score against this package will say so. This is
# exactly why the split is reported rather than assumed: a reader can see that this
# package's answer key rests on someone reading code, not on the database agreeing.
#
# Two deliberate omissions:
#
#   * is_active and lifetime_value receive literal 0 in the INSERT arm. A literal has no
#     source column, so there is no edge. Inventing one would be a false edge.
#   * The ON clause (d.cust_id = s.cust_id) is a JOIN condition, not a row filter. Join
#     keys are structural; treating them as filter lineage would flood every multi-table
#     statement with edges that tell a reader nothing about which rows were selected.
#     Applied consistently in the analyser and here.
#
# The MERGE arms are labelled as one deduplicated set. REGION and EMAIL are written by
# BOTH arms from the same source column, so they are one fact each, not two.

