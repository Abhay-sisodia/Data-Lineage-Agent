# STRUCTURED FORM (ADR-0001 amendment 1d). Compared on kind + subject, because the prose
# above and the analyser's prose describe the same fact in two vocabularies that no string
# comparison can reconcile. Subject is the EXECUTE IMMEDIATE site - where the unknowable
# text is run - not the line a fragment was assembled on, which is what the prose above
# says. The site is the thing both sides can name.
