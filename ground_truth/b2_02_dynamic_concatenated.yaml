note: >
  Expect zero recall from static analysis here, by design. Recall against this key
  measures the log-recovery leg, not the parser.

edges:
  # --- statement 1: column name chosen at runtime -------------------------------------
  #
  # is_active receives the literal 1, so again no value edge. The filter is the lineage.

  - source: {kind: column, name: DIM_CUSTOMER.REGION}
    target: {kind: relation, name: DIM_CUSTOMER}
    flow: filter
    transform: identity
    band: 2
    origin: {unit: B2_DYNAMIC_CONCATENATED, line: 29}
    evidence: source_read
    note: WHERE region = '<p_region>'. The literal is interpolated from a parameter.

  - source: {kind: column, name: TMP_RECENT.CUST_ID}
    target: {kind: relation, name: DIM_CUSTOMER}
    flow: filter
    transform: identity
    band: 2
    origin: {unit: B2_DYNAMIC_CONCATENATED, line: 30}
    evidence: source_read

  - source: {kind: column, name: DIM_CUSTOMER.CUST_ID}
    target: {kind: relation, name: DIM_CUSTOMER}
    flow: filter
    transform: identity
    band: 2
    origin: {unit: B2_DYNAMIC_CONCATENATED, line: 30}
    evidence: source_read
    note: The other operand of `cust_id IN (SELECT ...)`. Every operand is a filter edge.

  # --- statement 2: TABLE name chosen at runtime - the genuinely dark case -------------

  - source: {kind: column, name: STG_CUSTOMER.CUST_ID}
    target: {kind: column, name: TMP_RECENT.CUST_ID}
    flow: value
    transform: identity
    band: 2
    origin: {unit: B2_DYNAMIC_CONCATENATED, line: 35}
    evidence: adjudicated
    note: >
      True only because p_suffix was 'recent'. With any other value this edge points at a
      table that may not even exist - the procedure swallows the failure deliberately.

  - source: {kind: column, name: STG_CUSTOMER.LAST_LOGIN}
    target: {kind: column, name: TMP_RECENT.LAST_LOGIN}
    flow: value
    transform: identity
    band: 2
    origin: {unit: B2_DYNAMIC_CONCATENATED, line: 35}
    evidence: adjudicated

  # --- trigger side effects, inherited from the write to tmp_recent -------------------

  - source: {kind: column, name: DIM_CUSTOMER.LIFETIME_VALUE}
    target: {kind: column, name: DIM_CUSTOMER.LIFETIME_VALUE}
    flow: value
    transform: derived
    band: 2
    origin: {unit: TRG_RECENT_AUDIT, line: 18}
    evidence: observed

  # trg_recent_audit's own filter edge, TMP_RECENT.CUST_ID -> DIM_CUSTOMER, is NOT listed
  # separately. Its key is identical to the line-30 filter edge above - same endpoints,
  # same flow, same transform - and only the origin differs. The v0 match key carries no
  # origin, so the two collapse and this key under-counts by one edge. The label validator
  # rejected the duplicate outright, which is at least a loud failure.
  #
  # ADR-0001 amendment 1 for the second time in this key alone.

forbidden:
  - source: {kind: variable, name: P_COLUMN}
    target: {kind: column, name: DIM_CUSTOMER.IS_ACTIVE}
    flow: value
    reason: >
      p_column supplies the NAME of the target, not its value. An analyser that treats a
      concatenated fragment as a value source produces exactly this - a parameter feeding
      the column it happens to name. Same category error as a correlated predicate read
      as a value source, and it looks entirely reasonable in a diagram.

  - source: {kind: variable, name: P_SUFFIX}
    target: {kind: column, name: TMP_RECENT.CUST_ID}
    flow: value
    reason: >
      p_suffix picks the target TABLE. It cannot be a source of any column's value.

  - source: {kind: variable, name: P_REGION}
    target: {kind: column, name: DIM_CUSTOMER.IS_ACTIVE}
    flow: value
    reason: >
      p_region is interpolated into a WHERE clause. It selects rows; it supplies nothing.

