# Ground truth for adversarial/band2/b2_02_dynamic_concatenated.sql
#
# THE HOP THE WHOLE ARCHITECTURE TURNS ON. Statically undecidable; recoverable only from
# the query log, and only for paths actually exercised in the retention window.
#
# Observed with p_column = 'is_active', p_region = 'EU', p_suffix = 'recent'. Two runs
# were needed: the first showed nothing for IS_ACTIVE because the seed rows already held
# 1, so the write was idempotent and therefore invisible. Re-run after nulling the column.
# That is a limit of observation, not of the code, and it is recorded rather than hidden.
#
# EVERY EDGE BELOW IS ARGUMENT-DEPENDENT. Called with p_column = 'lifetime_value' the
# target column is different; called with p_suffix = 'stage' the target TABLE is
# different. These labels are the lineage OF THE OBSERVED CALL, not of the procedure.
# A static analyser cannot reach them at all, and a log-based one reaches exactly the
# argument values that ran. That distinction is the coverage story for this whole band.

