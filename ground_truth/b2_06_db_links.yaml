# PARSE-ONLY. This file is deliberately never compiled: crm_link does not exist and
# neither does the finance_dw schema, so there is nothing to observe and every label here
# is source_read and unexercised. That is not a weakness of the case - it IS the case.
# In a real estate the remote side is routinely out of scope, and the analyser has to
# produce something useful from source text alone.
#
# THE CORRECT OUTPUT IS NOT AN ERROR AND NOT SILENCE. It is edges up to the boundary,
# plus a counted boundary node at each crossing. Both halves matter:
#
#   * The projection IS visible. remote_customer.email -> dim_customer.email is readable
#     in the source and is a true fact. Refusing the whole statement because one relation
#     is unreachable throws away lineage we can actually prove.
#   * What is upstream of remote_customer is invisible, permanently, and that is a
#     dangling reference to be counted rather than a gap to be quiet about.
#
# This package is therefore the cleanest test of partial resolution: not "can you analyse
# it" but "can you analyse the part you can see and declare the part you cannot".

