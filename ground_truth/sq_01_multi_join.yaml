# Ground truth for adversarial/sql/sq_01_multi_join.sql
#
# Five tables, one LEFT JOIN, GROUP BY, aggregates over derived expressions.
#
# Observed: FCT_PRODUCT_SALES 0 -> 3 rows, all seven columns written.
# CATEGORY_NAME had a UNIQUE value-consistent source (STG_CATEGORIES.CATEGORY_NAME) and
# GROSS_SALES likewise (STG_ORDER_LINES.LINE_AMOUNT) - the strongest labels here.
# NET_SALES, REFUND_TOTAL and PERIOD_MONTH reported no value-consistent source, which is
# correct: they are computed and their values appear nowhere upstream.
#
# All edges are band 0. No variable, branch, loop or call is on any path - this file
# tests SQL difficulty, not procedural difficulty, which is the point of the band.
#
# Join conditions are NOT filter edges, per the convention set in b0_02: a join key is
# structural, and treating it as row-selection lineage would flood every multi-table
# statement with edges that tell a reader nothing.

