      MODEL LIMITATION, recorded rather than hidden: this exact edge occurs TWICE in
      this procedure - once on the happy path (line 23) and once in the NO_DATA_FOUND
      handler (line 35) - with different guards. They are two different facts: one fires
      when the policy lookup succeeds, one only when it fails. The v0 edge key is
      (source, target, flow, transform) and excludes guard, so the two collapse into one
      and the exception-path occurrence cannot be represented separately.

      ADR-0001 5 excludes guard from PRECISION so the gate cannot move on
      string-comparison noise. That was right, but it was over-applied: guard should be
      part of an edge's IDENTITY in the ledger while staying out of matching. T2.1 (IR
      v0) should fix this; until then this file under-counts by one edge and says so.

