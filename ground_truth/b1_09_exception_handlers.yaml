# Ground truth for adversarial/band1/b1_09_exception_handlers.sql
#
# An error path writes the same regulated column from a completely different source.
# On a failure day THAT is the lineage, and it exists nowhere in the happy path.
#
# Both paths observed, each needing its own setup:
#
#   happy    b1_exception_handlers('EU')  -> IS_ACTIVE written
#   handler  region 'XX' assigned to a customer first, then
#            b1_exception_handlers('XX')  -> NO_DATA_FOUND fires (no policy row for XX),
#                                            handler writes IS_ACTIVE = 0
#
# Without the setup the handler still fires but updates zero rows, so the write is
# invisible. Observing an exception path at all took deliberate construction - which is
# exactly why these edges are usually missed.
#
# The WHEN OTHERS arm is labelled unexercised: it is provably in the code and was never
# seen running. Tier and unexercised are separate axes - an edge can be fully evidenced
# in source AND never observed. Reporting that combination is something no other tool
# does, and it is the difference between "dead code, safe to remove" and "the year-end
# path that has not run yet".

