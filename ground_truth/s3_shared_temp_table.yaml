forbidden:
  - source: {kind: column, name: STG_ORDERS.CUST_ID}
    target: {kind: relation, name: DIM_CUSTOMER}
    flow: filter
    reason: >
      Fusion, A onto B. Composing `B: stg_orders -> tmp_recent` with `A: tmp_recent ->
      dim_customer` invents a path from the order staging table into the customer
      dimension. Observation refutes it directly: running B alone left is_active
      unchanged.

  - source: {kind: column, name: STG_ORDERS.ORDER_DATE}
    target: {kind: relation, name: DIM_CUSTOMER}
    flow: filter
    reason: >
      The same fusion through the punned column. Nothing about a customer's activity flag
      derives from an order date.

  - source: {kind: column, name: STG_CUSTOMER.CUST_ID}
    target: {kind: column, name: FCT_REVENUE.CUST_ID}
    flow: value
    reason: >
      Fusion, B onto A - the other direction, and it must be tested separately. An
      analyser that composes paths through a shared name will produce both; one that
      composes them in only one direction is still wrong, just harder to notice.

  - source: {kind: column, name: STG_CUSTOMER.LAST_LOGIN}
    target: {kind: column, name: FCT_REVENUE.PERIOD_MONTH}
    flow: value
    reason: >
      The most persuasive of the four, because the column names line up perfectly:
      last_login is truncated to a month and the source really is called last_login. It is
      still false - the rows fct_revenue was built from came from stg_orders.

boundaries:
