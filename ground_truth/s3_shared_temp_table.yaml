# Ground truth for adversarial/silent/s3_shared_temp_table.sql
#
# Two procedures, one table name, no relationship whatsoever.
#
# Observed separately, and the separation is the evidence:
#   * s3_temp_writer_a  -> TMP_RECENT written, then DIM_CUSTOMER.IS_ACTIVE written
#   * s3_temp_writer_b  -> TMP_RECENT written, then FCT_REVENUE written.
#                          DIM_CUSTOMER.IS_ACTIVE did NOT change.
#
# That second line is the whole case. Running B alone leaves is_active untouched, so
# `stg_orders -> dim_customer.is_active` is not a weakly-supported edge, it is a fact the
# database refuses. Key the temp relation on its name and forty procedures fuse into one
# invented lineage; here it would be two, and both directions are forbidden below.
#
# tmp_recent is a PERMANENT table in this corpus despite the prefix - established at T2.5
# by reading ALL_TABLES.TEMPORARY rather than trusting the name. That matters for the
# remedy: a temporary table's rows are session-private so a composed path is provably
# invented and can be refused outright, whereas a permanent one really is shared and
# whether data flows between two writers is NOT statically decidable. The honest output
# for the permanent case is a declared hazard, not a confident join and not silence.
#
# BANDING: every edge here is band 0. Both procedures are plain statement sequences with
# no variable, branch, loop, cursor or call on any path. The difficulty of this package is
# entirely in what must NOT be produced, which is why the forbidden section is longer than
# the edge list.

