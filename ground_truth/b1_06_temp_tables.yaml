# Ground truth for adversarial/band1/b1_06_temp_tables.sql
#
# stg_orders -> gtt_stage -> fct_revenue. At table level this looks like two unrelated
# pipelines; the intermediate hop is the whole point.
#
# Observed: GTT_STAGE 0 -> 3 rows and FCT_REVENUE 0 -> 3 rows in one run, confirming
# both halves of the chain.
#
# BANDING NOTE, and it is uncomfortable in our favour so it is stated plainly: every edge
# here is band 0 under the rule in b1_07. The chain passes through a real relation with
# real columns in the dictionary, so ordinary set-based analysis resolves it - no
# variable, branch, loop or call is on any path. Our existing band-0 analyser already
# produces these edges correctly.
#
# The construct is listed under band 1 in the spike's ladder, but the difficulty it
# names - "intermediate hops invisible at table level" - is a difficulty for
# TABLE-level tools, not for column-level analysis. Labelling these band 1 would hand
# band 1 seven free wins and inflate the number that decides the company.
#
# The genuinely hard part of temp tables is SESSION SCOPING, and it lives in
# silent/s3_shared_temp_table.sql: two unrelated procedures writing the same temp table
# name. That case must produce ZERO cross-procedure edges, and it is where this
# construct is actually tested.

