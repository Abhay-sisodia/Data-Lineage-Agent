# Ground truth for adversarial/band1/b1_01_local_variables.sql
#
# The canonical band-1 case. A policy table silently governs which customers load,
# three statements away, through two local variables.
#
# Observed with p_region = 'EU' (window_days = 30): TMP_RECENT 0 -> 2 rows, and
# LAST_LOGIN had a unique value-consistent source. The row count is itself evidence the
# filter chain works - an unfiltered load would have produced 4.
#
# Banding, per the rule in b1_07: an edge is band 1 only if ITS PATH traverses a
# variable, branch, loop, cursor or call. The two column-to-column projections here are
# ordinary INSERT ... SELECT work and are band 0 even though they sit inside a procedure.
# What is genuinely band 1 is everything touching v_days and v_cutoff.
#
# Nothing involving the variables is observable: they are session memory and never touch
# a table. Those four labels are source_read, and any score against this package should
# be read with that split in view.

