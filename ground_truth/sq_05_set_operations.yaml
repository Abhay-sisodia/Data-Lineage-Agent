# Three UNION ALL arms reading three DIFFERENT tables. Every output column therefore has
# three legitimate sources, and missing any one is a silent under-report - the trace would
# look complete and omit a whole feed.
#
# Set operations bind BY POSITION (silent failure s5). Arm 2 selects refund_amount where
# arm 1 selects line_amount: the names differ, the positions match, position wins.
#
# Arm 3's period_month is TRUNC(SYSDATE) - a literal expression with no source column, so
# it contributes no edge. Two arms feed period_month, not three.

