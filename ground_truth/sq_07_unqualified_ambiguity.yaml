# Ground truth for adversarial/sql/sq_07_unqualified_ambiguity.sql
#
# THE SILENT-FAILURE CASE OF THIS BAND.
#
# Four references are unqualified, and each names a column that exists on several tables
# in the schema but on exactly ONE table in this statement's FROM scope:
#
#   order_date   also on nothing else          -> STG_ORDERS
#   line_amount  also on nothing else          -> STG_ORDER_LINES
#   quantity     also on nothing else          -> STG_ORDER_LINES
#   status_code  also on stg_customer,         -> STG_PRODUCTS
#                stg_returns
#   cust_id      also on stg_customer,         -> STG_ORDERS
#                stg_returns, dim_customer,
#                dim_customer_hier
#
# Oracle resolves every one correctly, because scope is what matters. An analyser that
# resolves names against the whole DICTIONARY rather than against the statement's own
# FROM clause will bind status_code or cust_id to the wrong table - and the result
# parses, runs, and looks entirely normal.
#
# The two that matter are status_code and cust_id. If either is attributed to
# stg_customer or stg_returns, that is a confident wrong answer of exactly the kind the
# evidence model cannot catch, because all three witnesses would agree on it.

