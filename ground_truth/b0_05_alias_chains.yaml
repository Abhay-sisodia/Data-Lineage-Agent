# Ground truth for adversarial/band0/b0_05_alias_chains.sql
#
# A column renamed four times between source and target, with a derivation part-way and
# an aggregation on top.
#
# Observation confirmed all four FCT_REVENUE columns written. NET_AMOUNT and
# PERIOD_MONTH reported NO value-consistent source, which is itself the right answer:
# their values do not appear anywhere upstream because they are computed. That absence
# is corroboration for the DERIVED and AGGREGATED classes rather than a failure to find
# the source.
#
# ORDER_COUNT has no edge at all: COUNT(*) references no source column. A row count is
# not lineage from any particular column, and inventing one would be a false edge.

