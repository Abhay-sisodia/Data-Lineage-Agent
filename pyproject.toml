[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-spike"
version = "0.0.0"
description = "Phase 0 spike: column-level lineage through procedural Oracle PL/SQL, with a scoring harness."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }

# Runtime dependencies are declared loosely here and in requirements.in.
# The authoritative, reproducible set is the compiled requirements.txt.
dependencies = [
    "sqlglot",
    "antlr4-python3-runtime",
    "pydantic",
    "pyyaml",
    "typer",
    "rich",
    "oracledb",
]

[project.scripts]
lineage = "lineage.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "adversarial: silent-failure regression cases (T3.4) - never delete one",
    "requires_oracle: needs a live Oracle XE instance",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
# Machine-generated by scripts/generate_parser.py. Not ours to style, and regenerated
# wholesale on every run - linting it would produce noise nobody can act on.
# grammars/ holds vendored upstream files (Apache-2.0, grammars-v4); they are kept
# byte-identical to upstream so they can be re-fetched and diffed.
extend-exclude = ["src/lineage/parsing/generated", "grammars"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["lineage"]
mypy_path = "src"
strict = true
warn_unreachable = true
exclude = ["src/lineage/parsing/generated/"]

# The generated parser and the ANTLR runtime ship no type information. Our own code
# stays strict; we simply do not pretend to know the shape of what ANTLR emitted.
[[tool.mypy.overrides]]
module = ["antlr4.*", "lineage.parsing.generated.*"]
ignore_missing_imports = true
follow_imports = "skip"
