note: '1504 lines, 28 units, 48 statements. Depth rather than novelty: five-level CTE chains, four and
  five table joins, aggregation at two different grains in the same statement, windows stacked three scopes
  apart, two MERGEs of different shape, and a five-level filter cascade. Every construct appears in stress
  1, 2 or 3.


  S1-05, MEASURED ON A PRODUCTION-SHAPED PACKAGE. 334 edges were written from source; only 240 could be
  STATED. The match key is (source, target, flow, transform, phase) and origin is not part of it (amendment
  1b), so 94 edges - 28.1% - collided with an identical claim from a different statement and had to be
  collapsed. 56 keys collide; 27 of the 28 units are affected. The worst is STG_ORDERS.ORDER_DATE -> FCT_PRODUCT_SALES.PERIOD_MONTH
  [value/derived], produced by SEVEN different statements doing seven different things, which this key
  can say once. The edges kept are the first occurrence of each key. Every dropped claim is listed in
  the comment block at the top of this file, so the loss is counted rather than hidden.'
