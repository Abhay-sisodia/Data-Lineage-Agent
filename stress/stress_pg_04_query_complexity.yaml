    note: >
      FLAGGED - THE PHASE IS A JUDGEMENT AND MAY BE WRONG.

      `WHERE a.buyers >= 3` in the OUTER query, where buyers is COUNT(DISTINCT f.cust_id)
      computed inside `agg`. Syntactically it is a WHERE, which defaults to
      pre-aggregation; semantically it removes rows AFTER the aggregate that decides them
      has been computed, which is precisely what D-2 created post-aggregation to express.

      Labelled by what it DOES rather than by the keyword, because D-2's rule is about
      when the filter acts: `WHERE quantity > 0` would discard lines before they were
      counted, and this discards products whose distinct-buyer count came to two. Same
      shape as a HAVING wearing a different keyword.

      If the analyser says pre-aggregation, that is a CONVENTION finding - the phase rule
      has never been asked about a WHERE over an already-aggregated CTE - and not a defect.

