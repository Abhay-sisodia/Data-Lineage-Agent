# Ground truth for stress/stress_pg_04_query_complexity.sql
#
# WRITTEN FROM SOURCE, BEFORE THE ANALYSER WAS RUN OVER THIS FILE.
#
# THREE STATEMENTS, 79 LABELS, AND ALL OF THE DIFFICULTY IS IN THE SELECT. No routines, no
# procedures, no DDL. Each query is wrapped in the smallest possible `INSERT INTO ... SELECT`
# because a bare SELECT currently produces nothing at all - 0 edges, 0 refusals, 0
# boundaries, not even counted (PG-09). The wrapper contributes one line; every construct
# under test is below it.
#
# TWO FLAGGED LABELS AND ONE FLAGGED SILENCE, named at the statement rather than settled
# quietly in my favour:
#
#   * Q1 - the phase of `WHERE a.buyers >= 3`, a WHERE in the outer query over a value the
#     CTE already aggregated
#   * Q3 - the transform of gross_amount into net_amount, where ONE operand of the
#     expression passes through an aggregate and the other two do not
#   * Q3 - `DISTINCT ON`, which selects rows and has no convention here. Not labelled.
#
# Conventions are stress_pg_01's. The one that does the most work in this file is
# CONVENTION (a), which Q2 is built around: an `EXCEPT` / `INTERSECT` second arm decides
# which rows survive and supplies NO value, so its columns are filter lineage on the written
# relation. Both arms of Q2's EXCEPT read the same relation, which is what makes it a test.

