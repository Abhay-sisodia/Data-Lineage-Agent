# Ground truth for stress/stress_03_modern_complexity.sql
#
# WRITTEN FROM SOURCE, BEFORE THE ANALYSER WAS RUN OVER IT. Same rule as stress 1, stress 2
# and the phase-0 corpus. A key written after seeing the output records what the analyser
# did rather than what is true, and there is no way to tell the two apart afterwards.
#
# All source_read. Parse-only, nothing executed.
#
# CONVENTIONS CARRIED FORWARD (none invented silently; new ones are flagged in place):
#   * match key is (source, target, flow, transform, phase)
#   * a filter edge targets the relation the STATEMENT WRITES
#   * a HAVING is `filter` with `phase: post-aggregation`; a WHERE takes the default
#     `pre-aggregation`, which is not written out (D-2)
#   * GROUP BY is `influence` onto every AGGREGATED output column, targeting the COLUMN.
#     Grouping keys projected through get no influence onto themselves - that would say a
#     column decides its own value (D-2)
#   * a window's PARTITION BY / ORDER BY is `influence` onto the COLUMN it produces (D-4)
#   * a JOIN CONDITION is structural wherever it is written, and produces no edge (D-5)
#   * a CASE condition is a VALUE source with transform `conditional` - a predicate that
#     selects a ROW is filter, a predicate that selects an EXPRESSION is value
#     (s8_aggregation_semantics, and b1_08 for the cross-unit form)
#   * a value-selecting window function is `derived`, not `aggregated` (D-3)
#   * literals, COUNT(*), ROWNUM and SYSDATE produce no edge - no upstream to name
#   * transform is the STRONGEST on the path: aggregated > conditional > derived > identity
#   * band: set-based 0, variable/cursor/loop 1, dynamic SQL and triggers 2
#
# FOUR CONVENTIONS HAVE NO PRECEDENT AND ARE PROPOSED HERE, flagged at the edge:
#   (d) KEEP (DENSE_RANK FIRST ORDER BY x) - the ORDER BY decides WHICH ROW's value is
#       kept, exactly as a window ORDER BY does, so it is `influence` onto the column and
#       not a value source. The aggregate itself (MAX) still makes the value `aggregated`.
#   (e) GROUPING_ID(a, b) - its arguments genuinely determine the number returned, because
#       the result is a bitmap of which of them are grouped in this row. So they are VALUE
#       sources, and `aggregated` because the function has no meaning outside a GROUP BY.
#       This is the one construct here whose value is about the QUERY SHAPE rather than
#       about any row, and it is labelled the way it is because the number still cannot be
#       computed without naming those columns.
#   (f) An IN (SELECT ...) semi-join. D-5 made join conditions structural "wherever
#       written", and its worked examples are all `ON` clauses and `EXISTS` correlations;
#       the stress-2 convention says an IN/EXISTS predicate decides WHICH ROW and is
#       therefore filter. THE TWO CAN BE READ AS CONFLICTING HERE. This key follows
#       stress 2 and labels the outer column as `filter`, because D-5's argument is about
#       a condition that JOINS two relations for projection, and this one does not project
#       anything from ref_policy. Flagged so that a disagreement is attributable to the
#       convention rather than read as an analyser defect.
#   (g) A MERGE arm-level WHERE over an already-aggregated scalar. It is not a HAVING, so
#       the phase stays the default `pre-aggregation`, but the thing it tests was computed
#       by a SUM. Labelled pre-aggregation because `phase` distinguishes WHERE from HAVING
#       as CLAUSES, not as a claim about what the value went through.
#
# WHAT THIS PACKAGE IS AIMED AT. scripts/probe_analyser.py found 48 constructs that emit
# edges no key had ever checked. Stress 1 went wide on constructs and stress 2 went deep on
# them; this one goes deep on COMBINATIONS, because every combination-shaped bug this
# project has had passed its minimal case first - `_grouping_influence` dropped nested
# groupings while handling a flat GROUP BY correctly, and the window-influence false
# positives were only wrong once traced through a CTE.

