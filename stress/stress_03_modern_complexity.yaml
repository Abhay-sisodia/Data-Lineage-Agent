forbidden:
  - source: {kind: column, name: STG_ORDER_LINES.ORDER_ID}
    target: {kind: column, name: FCT_REVENUE.CUST_ID}
    flow: value
    reason: >
      The join key read as a value source. `ON l.order_id = b.order_id` is structural
      under D-5 and contributes to nothing. Four call sites had to be fixed to make that
      true; this is the guard against the fifth.

  - source: {kind: column, name: STG_ORDERS.NET_VALUE}
    target: {kind: column, name: FCT_REVENUE.NET_AMOUNT}
    flow: value
    reason: >
      `net_value` is computed in order_base and never selected again. A dead CTE column
      must produce no edge - inventing one would mean the analyser is reading the
      projection rather than the path.

  - source: {kind: column, name: STG_ORDERS.ORDER_DATE}
    target: {kind: column, name: FCT_REVENUE.PERIOD_MONTH}
    flow: influence
    reason: >
      GROUP BY influence onto a GROUPING KEY that is projected through unchanged. D-2 is
      explicit that this would say a column decides its own value. period_month is both
      the grouping key and the output, which is the exact shape the rule excludes.

  - source: {kind: column, name: STG_ORDER_LINES.QUANTITY}
    target: {kind: column, name: FCT_PRODUCT_SALES.NET_SALES}
    flow: value
    reason: >
      KEEP (DENSE_RANK FIRST ORDER BY quantity) read as a value source. None of quantity
      is in the list_price that comes out; it only chooses the row. Convention (d) says
      influence, and this is its negative half - the same relationship RANK()'s ORDER BY
      had in stress 2.

  - source: {kind: column, name: STG_CUSTOMER.CUST_ID}
    target: {kind: column, name: DIM_CUSTOMER.LIFETIME_VALUE}
    flow: value
    reason: >
      The trigger's edge attributed to the CALLER's source column. lifetime_value is fed
      by its own prior value, not by anything in stg_customer. Attributing inherited
      edges to whatever the caller happened to read is the failure T3.3 exists to prevent.

  - source: {kind: column, name: REF_POLICY.REGION}
    target: {kind: column, name: TMP_RECENT.CUST_ID}
    flow: value
    reason: >
      The semi-join's inner column read as a value source. ref_policy projects nothing;
      it only decides which customers survive. Under either reading of (f) this edge is
      wrong.

expected_boundaries:
  # KEY ERROR, CORRECTED 2026-09-12 (finding S3-05). Written as `[]` on the first pass,
  # which claimed this package stops nowhere. It stops in one place, loudly, and a key
  # that does not say so cannot tell a declared gap from a silent one - which is the only
  # distinction this project ultimately sells.
  - kind: refusal
    subject: "S3_BULK_RECONCILE:194"
    reason: >
      `FETCH c_returns BULK COLLECT INTO l_batch LIMIT 500` is refused
      UNSUPPORTED_CONSTRUCT. S2-04 fixed `SELECT ... BULK COLLECT INTO`; the CURSOR form
      with a %ROWTYPE collection and a LIMIT is a different path and is still refused.

      THE REFUSAL IS WHY unit 5's four column-level edges are missing, and it is the
      honest outcome rather than a silent one - but it is still four edges of real
      lineage, and the labels above are kept so the cost is counted.
