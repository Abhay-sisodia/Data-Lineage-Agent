# Ground truth for stress/stress_pg_05_single_query.sql
#
# WRITTEN FROM SOURCE, BEFORE THE ANALYSER WAS RUN OVER THIS FILE.
#
# ONE STATEMENT, 461 LINES, SIXTEEN CTEs, SEVEN BASE RELATIONS, 82 LABELS. The question is
# whether lineage survives LENGTH - whether a value entering at stg_order_lines.quantity
# still arrives, with the right flow and the right transform class, after five changes of
# grain and four window functions.
#
# ------------------------------------------------------------------------------------
# HOW THIS KEY WAS DERIVED, because at this size "I read it carefully" is not a method
# ------------------------------------------------------------------------------------
#
# Per TARGET COLUMN, not per CTE. For each of the twenty projections in the final SELECT I
# walked backwards to the base relations, recording every column that contributes and the
# hardest transform on ITS OWN path. Then, separately, per AGGREGATION: each of the six
# GROUP BYs contributes influence from its grouping keys to every aggregated column that
# reaches a target, and each of the four window clauses contributes influence from its
# PARTITION BY and ORDER BY to its own output column.
#
# Working the two directions separately is deliberate. Walking only backwards from targets
# finds value edges and misses influence; walking only forwards from aggregations finds
# influence and invents value. Both Oracle key-error findings (S2-06, S4-06) were omissions
# that one direction would have caught and the other did not.
#
# ------------------------------------------------------------------------------------
# WHAT THIS KEY DELIBERATELY DOES NOT STATE
# ------------------------------------------------------------------------------------
#
# ROW SELECTION BY RANK. `tcr.rn = 1` in a join condition selects one category per customer
# using ROW_NUMBER's partition and ordering. So stg_orders.cust_id and the category spend
# genuinely decide WHICH category_name lands in top_category_name - and this project has no
# convention for row selection by rank, as opposed to by predicate. Unlabelled and flagged,
# exactly as stress_pg_02 leaves ORDER BY ... LIMIT and stress_pg_04 leaves DISTINCT ON.
# An edge here scores as a false positive; that number is wrong and this note is right.
#
# THREE TARGETS HAVE NO VALUE SOURCE AT ALL, and the absence is an assertion:
#   orders_placed    COUNT(*) - no column in it
#   category_depth   the recursive literal 1, then its own previous value
#   segment          a literal in BOTH arms of the UNION ALL
# Two more have influence and no value: region_rank and cohort_rank take no argument.
#
# ------------------------------------------------------------------------------------
# THE ONE PLACE THIS KEY KNOWINGLY RESTATES AN OPEN DECISION
# ------------------------------------------------------------------------------------
#
# `segments` filters on mc.net_revenue, which the CTE below it already aggregated. Under
# PG-10 the key's position is that a WHERE over an already-aggregated value acts
# POST-aggregation. Three edges here take that position, and if PG-10 is settled the other
# way they are the cost. Stated so the decision can be priced rather than argued.
#
# Conventions otherwise are stress_pg_01's. Band 0 throughout. Lower case throughout.

