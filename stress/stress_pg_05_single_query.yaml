forbidden:
  - source: {kind: column, name: stg_order_lines.unit_price}
    target: {kind: column, name: fct_customer_360.net_revenue}
    flow: value
    reason: >
      THE UNREFERENCED-PROJECTION TRAP, and the most important entry here.

      unit_price reaches `line_value`, which reaches `line_total`, WHICH NOTHING EVER USES:
      order_facts computes it and monthly_customer does not select it. Its other path, into
      customer_top_category.category_value, feeds only a ROW_NUMBER ordering and is not a
      value source either. So unit_price contributes NO VALUE TO ANY TARGET COLUMN in this
      query - despite stg_order_lines being genuinely read, genuinely joined, and a real
      value source for units_bought through a different column.

      An analyser that traces every projection of a CTE rather than the ones actually
      referenced produces this edge, and it looks completely ordinary.

  - source: {kind: column, name: stg_order_lines.unit_price}
    target: {kind: column, name: fct_customer_360.gross_revenue}
    flow: value
    reason: >
      The same invention pointed at the target whose NAME most suggests it. gross_revenue
      is SUM(f.gross_amount) out of stg_orders and has nothing to do with line prices - the
      two are different numbers in any real warehouse, and conflating them is the error
      that makes a lineage report worse than none.

  - source: {kind: column, name: stg_categories.category_name}
    target: {kind: column, name: fct_customer_360.category_depth}
    flow: value
    reason: >
      A recursive CTE's self-reference resolved to the anchor's relation. `depth` is the
      literal 1, then t.depth + 1 - its own previous value - and category_name is the other
      column the anchor projects, which makes it the nearest plausible invention.

  - source: {kind: column, name: stg_categories.parent_category_id}
    target: {kind: column, name: fct_customer_360.category_depth}
    flow: value
    reason: >
      The same invention by the other route: depth "comes from" the hierarchy, so the
      column defining the hierarchy looks like its source. It decides which rows join, not
      what number lands in depth.

  - source: {kind: column, name: fct_customer_360.region}
    target: {kind: column, name: fct_customer_360.region_rank}
    flow: value
    reason: >
      A window's PARTITION BY read as a value source. RANK() takes no argument, so
      region_rank has no value upstream at all.

  - source: {kind: column, name: stg_orders.order_id}
    target: {kind: column, name: fct_customer_360.net_revenue}
    flow: value
    reason: >
      A join key read as a value source. order_id threads six CTEs as the key that holds
      the pipeline together and is in none of the money.

  - source: {kind: column, name: stg_customer.cust_id}
    target: {kind: column, name: fct_customer_360.orders_placed}
    flow: value
    reason: >
      COUNT(*) given a value source. The grouping decides what the count comes to, which is
      labelled above as influence from stg_orders.cust_id; no column is IN it.

  - source: {kind: column, name: ref_policy.window_days}
    target: {kind: column, name: fct_customer_360.revenue_share_of_region}
    flow: value
    reason: >
      A predicate inside an IN subquery read as a value source. ref_policy contributes two
      filter edges and nothing else - no column of it is written anywhere.

