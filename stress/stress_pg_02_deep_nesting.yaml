# THE WRONG ANSWERS THIS FILE INVITES
# ====================================================================================

forbidden:
  - source: {kind: column, name: stg_categories.category_name}
    target: {kind: column, name: dim_customer_hier.depth}
    flow: value
    reason: >
      A recursive CTE's self-reference resolved to the anchor's relation. `depth` is the
      literal 1, then t.depth + 1 - its own previous value and nothing else. Any base-table
      source for it is invented, and category_name is the nearest plausible one because it
      is the other column the anchor projects.

  - source: {kind: column, name: stg_categories.parent_category_id}
    target: {kind: column, name: dim_customer_hier.depth}
    flow: value
    reason: >
      The same invention by the other route - depth "comes from" the hierarchy, so the
      column that defines the hierarchy looks like its source. It is not: parent_category_id
      decides which rows join, not what number lands in depth.

  - source: {kind: column, name: fct_cohort.region}
    target: {kind: column, name: fct_cohort.rank_in_region}
    flow: value
    reason: >
      A window's PARTITION BY read as a value source, five CTEs deep. RANK() takes no
      argument, so rank_in_region has no value upstream at all. S3-02 is the record of this
      exact rule holding at the top level and breaking one level down; here it is four
      levels down.

  - source: {kind: column, name: stg_orders.order_date}
    target: {kind: column, name: gtt_stage.note}
    flow: value
    reason: >
      string_agg's ORDER BY read as a value source. It decides the ORDER of the pieces, and
      no part of order_date appears in the resulting string. The key states this dependency
      as `influence`, which is the whole reason D-4 created a third flow.

  - source: {kind: column, name: stg_customer.cust_id}
    target: {kind: column, name: audit_log.changed_by}
    flow: value
    reason: >
      The join key read as the source of the unnested element. changed_by is t.tag, an
      element of c.tags; cust_id only decides which customer's array is unnested.

  - source: {kind: column, name: stg_orders.cust_id}
    target: {kind: column, name: fct_revenue_stage.order_count}
    flow: value
    reason: >
      COUNT(*) given a value source. There is no column in it. The grouping key does decide
      what the count comes to, which is real and is labelled above as `influence` - and the
      difference between the two claims is the difference between "this number is made of
      cust_id" and "this number depends on how the rows were grouped".

  - source: {kind: column, name: stg_returns.cust_id}
    target: {kind: column, name: fct_revenue_stage.cust_id}
    flow: value
    reason: >
      An IN subquery's projected column read as value lineage into the identically-named
      target. It is not: the INSERT projects o.cust_id, and the subquery only decides which
      of those rows survive. The matching names are what make this one plausible.

