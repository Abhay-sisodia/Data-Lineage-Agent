  # ---- NOT LABELLED, AND FLAGGED: the LATERAL's own ORDER BY ... LIMIT 5 ----------
  #
  # `ORDER BY o2.order_date DESC LIMIT 5` decides WHICH five orders each customer
  # contributes, so order_date genuinely changes what `amount` comes to. That is a real
  # dependency and this key does not state it.
  #
  # Deliberately, and this is a CONVENTION QUESTION rather than a labelling decision. No
  # convention in this project covers row-selecting ORDER BY + LIMIT. The candidates are
  # `filter` (it removes rows - but it removes them by rank, not by a predicate, so no
  # value of order_date tells you whether a row survives) and `influence` (it decides an
  # aggregate's value - but so would a WHERE, and that is a filter). Choosing one here
  # would settle a convention inside a key, which is how the two Oracle keys came to hold
  # OPPOSITE conventions for a window's ORDER BY and neither side noticed for two runs.
  #
  # If the analyser emits an edge here it will score as a false positive. That number is
  # wrong and the note is right: file it as a convention finding, do not silently add the
  # label the analyser happens to produce.

