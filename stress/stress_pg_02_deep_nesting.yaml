# Ground truth for stress/stress_pg_02_deep_nesting.sql
#
# WRITTEN FROM SOURCE, BEFORE THE ANALYSER WAS RUN OVER THIS FILE.
#
# THIS KEY IS LESS CERTAIN THAN stress_pg_01's, AND THE UNCERTAINTY IS NAMED. Three
# constructs here have no precedent anywhere in this project, and each is flagged at the
# statement it appears in rather than being settled quietly in my favour:
#
#   * a RECURSIVE CTE's self-reference       (statement B, `depth`)
#   * an inner ORDER BY ... LIMIT that selects rows (statement C, the LATERAL)
#   * an aggregate's FILTER (WHERE ...) clause      (statement C, `amount`)
#
# Where the analyser disagrees with a flagged label, the finding is a CONVENTION gap and
# belongs in the register as one. Where it disagrees with an UNflagged label, one of us has
# a defect. Separating those two before the run is the entire value of writing the key
# first - afterwards, every disagreement looks like a convention question.
#
# Conventions are stress_pg_01's, unchanged. Band 0 throughout: PostgreSQL has no band 1.
# Lower case throughout: `dialects.fold` folds PostgreSQL identifiers down.

