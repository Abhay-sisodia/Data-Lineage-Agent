- id: clause:SelectStmt.whereClause
  target: lineage
  reach: [src.a.k -> relation:tgt.t]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a WHERE a.k > 3

- id: clause:SelectStmt.groupClause
  target: lineage
  reach: [src.a.v -> tgt.t.v, src.a.k -> tgt.t.v]
  sql: INSERT INTO tgt.t (k, v) SELECT a.k, sum(a.v) FROM src.a AS a GROUP BY a.k

- id: clause:SelectStmt.havingClause
  target: lineage
  reach: [src.a.v -> relation:tgt.t]
  sql: INSERT INTO tgt.t (k) SELECT a.k FROM src.a AS a GROUP BY a.k HAVING sum(a.v) > 100

- id: clause:SelectStmt.distinctClause
  target: lineage
  reach: [src.a.d -> relation:tgt.t]
  note: DISTINCT ON keeps one row per key, chosen by the ORDER BY
  sql: INSERT INTO tgt.t (k, v) SELECT DISTINCT ON (a.k) a.k, a.v FROM src.a AS a ORDER BY a.k, a.d DESC

- id: extra:plain_distinct
  target: lineage
  reach: [src.a.k -> tgt.t.k]
  sql: INSERT INTO tgt.t (k) SELECT DISTINCT a.k FROM src.a AS a

- id: clause:SelectStmt.sortClause
  covers: [node:SortBy]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  note: an ORDER BY without a limit decides nothing (D-9)
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a ORDER BY a.w

- id: clause:SelectStmt.limitCount
  covers: [variant:SelectStmt.limitOption=LIMIT_OPTION_COUNT]
  target: lineage
  reach: [src.a.w -> relation:tgt.t]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a ORDER BY a.w LIMIT 5

- id: clause:SelectStmt.limitOffset
  target: lineage
  reach: [src.a.w -> relation:tgt.t]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a ORDER BY a.w OFFSET 10 LIMIT 5

- id: variant:SelectStmt.limitOption=LIMIT_OPTION_WITH_TIES
  target: lineage
  reach: [src.a.w -> relation:tgt.t]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a ORDER BY a.w FETCH FIRST 5 ROWS WITH TIES

- id: variant:SortBy.sortby_dir=SORTBY_ASC
  target: lineage
  reach: [src.a.w -> relation:tgt.t]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a ORDER BY a.w ASC LIMIT 1

- id: variant:SortBy.sortby_dir=SORTBY_DESC
  target: lineage
  reach: [src.a.w -> relation:tgt.t]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a ORDER BY a.w DESC LIMIT 1

- id: variant:SortBy.sortby_dir=SORTBY_USING
  target: lineage
  reach: [src.a.w -> relation:tgt.t]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a ORDER BY a.w USING > LIMIT 1

- id: variant:SortBy.sortby_nulls=SORTBY_NULLS_FIRST
  target: lineage
  reach: [src.a.w -> relation:tgt.t]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a ORDER BY a.w NULLS FIRST LIMIT 1

- id: variant:SortBy.sortby_nulls=SORTBY_NULLS_LAST
  target: lineage
  reach: [src.a.w -> relation:tgt.t]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a ORDER BY a.w DESC NULLS LAST LIMIT 1

- id: extra:ordinal_order_by
  target: lineage
  reach: [src.a.w -> relation:tgt.t]
  sql: INSERT INTO tgt.t (v, w) SELECT a.v, a.w FROM src.a AS a ORDER BY 2 LIMIT 1

- id: extra:row_number_cut
  target: lineage
  reach: [src.a.d -> relation:tgt.t]
  sql: |
    INSERT INTO tgt.t (k, v)
    SELECT r.k, r.v FROM (SELECT a.k, a.v, row_number() OVER (PARTITION BY a.k ORDER BY a.d DESC) AS rn FROM src.a AS a) AS r
    WHERE r.rn = 1

- id: variant:SelectStmt.op=SETOP_UNION
  covers: [clause:SelectStmt.larg, clause:SelectStmt.rarg]
  target: lineage
  reach: [src.a.v -> tgt.t.v, src.b.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a UNION SELECT b.v FROM src.b AS b

- id: clause:SelectStmt.all
  target: lineage
  reach: [src.a.v -> tgt.t.v, src.b.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a UNION ALL SELECT b.v FROM src.b AS b

- id: variant:SelectStmt.op=SETOP_INTERSECT
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a INTERSECT SELECT b.v FROM src.b AS b

- id: variant:SelectStmt.op=SETOP_EXCEPT
  target: lineage
  reach: [src.a.v -> tgt.t.v, src.b.v -> relation:tgt.t]
  note: EXCEPT's right arm only removes rows - a filter
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a EXCEPT SELECT b.v FROM src.b AS b

- id: clause:SelectStmt.valuesLists
  target: no_lineage
  note: literals only - nothing to trace, but the statement must be counted
  sql: INSERT INTO tgt.t (k, n) VALUES (1, 'one'), (2, 'two')

- id: clause:SelectStmt.lockingClause
  covers: [node:LockingClause, variant:LockingClause.strength=LCS_FORUPDATE]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a FOR UPDATE

- id: variant:LockingClause.strength=LCS_FORNOKEYUPDATE
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a FOR NO KEY UPDATE SKIP LOCKED

- id: variant:LockingClause.strength=LCS_FORSHARE
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a FOR SHARE NOWAIT

- id: variant:LockingClause.strength=LCS_FORKEYSHARE
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a FOR KEY SHARE OF a

- id: variant:GroupingSet.kind=GROUPING_SET_ROLLUP
  covers: [node:GroupingSet]
  target: lineage
  reach: [src.a.v -> tgt.t.v, src.a.k -> tgt.t.v]
  sql: INSERT INTO tgt.t (k, n, v) SELECT a.k, a.n, sum(a.v) FROM src.a AS a GROUP BY ROLLUP (a.k, a.n)

- id: variant:GroupingSet.kind=GROUPING_SET_CUBE
  target: lineage
  reach: [src.a.v -> tgt.t.v, src.a.k -> tgt.t.v]
  sql: INSERT INTO tgt.t (k, n, v) SELECT a.k, a.n, sum(a.v) FROM src.a AS a GROUP BY CUBE (a.k, a.n)

- id: variant:GroupingSet.kind=GROUPING_SET_SETS
  covers: [variant:GroupingSet.kind=GROUPING_SET_EMPTY]
  target: lineage
  reach: [src.a.v -> tgt.t.v, src.a.k -> tgt.t.v]
  sql: INSERT INTO tgt.t (k, n, v) SELECT a.k, a.n, sum(a.v) FROM src.a AS a GROUP BY GROUPING SETS ((a.k), (a.n), ())

- id: extra:rollup_of_a_composite
  target: lineage
  reach: [src.a.v -> tgt.t.v, src.a.k -> tgt.t.v]
  sql: INSERT INTO tgt.t (k, n, v) SELECT a.k, a.n, sum(a.v) FROM src.a AS a GROUP BY ROLLUP ((a.k, a.n))

- id: clause:SelectStmt.groupDistinct
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (k, n, v) SELECT a.k, a.n, sum(a.v) FROM src.a AS a GROUP BY DISTINCT ROLLUP (a.k), CUBE (a.n)

- id: node:GroupingFunc
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  note: GROUPING(k) reports which grouping set a row belongs to, not k's value
  sql: INSERT INTO tgt.t (id, k, v) SELECT GROUPING(a.k), a.k, sum(a.v) FROM src.a AS a GROUP BY ROLLUP (a.k)

# ===========================================================================================
# WITH
# ===========================================================================================

- id: clause:SelectStmt.withClause
  covers: [node:WithClause, node:CommonTableExpr]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    INSERT INTO tgt.t (v)
    WITH s AS (SELECT a.v FROM src.a AS a) SELECT s.v FROM s

- id: clause:InsertStmt.withClause
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    WITH s AS (SELECT a.v FROM src.a AS a)
    INSERT INTO tgt.t (v) SELECT s.v FROM s

- id: clause:UpdateStmt.withClause
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    WITH s AS (SELECT a.id, a.v FROM src.a AS a)
    UPDATE tgt.t AS t SET v = s.v FROM s WHERE s.id = t.id

- id: clause:DeleteStmt.withClause
  target: lineage
  reach: [src.a.b -> relation:tgt.t]
  sql: |
    WITH gone AS (SELECT a.id FROM src.a AS a WHERE a.b)
    DELETE FROM tgt.t AS t WHERE t.id IN (SELECT gone.id FROM gone)

- id: clause:MergeStmt.withClause
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    WITH s AS (SELECT a.id, a.v FROM src.a AS a)
    MERGE INTO tgt.t AS t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET v = s.v

- id: variant:CommonTableExpr.ctematerialized=CTEMaterializeAlways
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    INSERT INTO tgt.t (v)
    WITH s AS MATERIALIZED (SELECT a.v FROM src.a AS a) SELECT s.v FROM s

- id: variant:CommonTableExpr.ctematerialized=CTEMaterializeNever
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    INSERT INTO tgt.t (v)
    WITH s AS NOT MATERIALIZED (SELECT a.v FROM src.a AS a) SELECT s.v FROM s

- id: extra:recursive_cte
  target: lineage
  reach: [src.a.id -> tgt.t.id, src.a.k -> tgt.t.k]
  sql: |
    INSERT INTO tgt.t (id, k)
    WITH RECURSIVE tree AS (
      SELECT a.id, a.k FROM src.a AS a WHERE a.k IS NULL
      UNION ALL
      SELECT c.id, c.k FROM src.a AS c JOIN tree ON c.k = tree.id
    )
    SELECT tree.id, tree.k FROM tree

- id: node:CTESearchClause
  target: lineage
  reach: [src.a.id -> tgt.t.id]
  sql: |
    INSERT INTO tgt.t (id, k)
    WITH RECURSIVE tree AS (
      SELECT a.id, a.k FROM src.a AS a WHERE a.k IS NULL
      UNION ALL
      SELECT c.id, c.k FROM src.a AS c JOIN tree ON c.k = tree.id
    ) SEARCH DEPTH FIRST BY id SET ord
    SELECT tree.id, tree.k FROM tree ORDER BY tree.ord

- id: node:CTECycleClause
  target: lineage
  reach: [src.a.id -> tgt.t.id]
  sql: |
    INSERT INTO tgt.t (id, k)
    WITH RECURSIVE tree AS (
      SELECT a.id, a.k FROM src.a AS a WHERE a.k IS NULL
      UNION ALL
      SELECT c.id, c.k FROM src.a AS c JOIN tree ON c.k = tree.id
    ) CYCLE id SET is_cycle USING path
    SELECT tree.id, tree.k FROM tree

- id: extra:data_modifying_cte
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  note: the DELETE's RETURNING rows feed the INSERT
  sql: |
    WITH moved AS (DELETE FROM src.a AS a WHERE a.b RETURNING a.id, a.v)
    INSERT INTO tgt.t (id, v) SELECT moved.id, moved.v FROM moved

