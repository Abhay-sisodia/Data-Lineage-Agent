- id: clause:InsertStmt.onConflictClause
  covers: [node:OnConflictClause, node:InferClause, variant:OnConflictClause.action=ONCONFLICT_UPDATE]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    INSERT INTO tgt.t AS t (id, v) SELECT a.id, a.v FROM src.a AS a
    ON CONFLICT (id) DO UPDATE SET v = EXCLUDED.v WHERE t.v IS DISTINCT FROM EXCLUDED.v

- id: variant:OnConflictClause.action=ONCONFLICT_NOTHING
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (id, v) SELECT a.id, a.v FROM src.a AS a ON CONFLICT DO NOTHING

- id: variant:InsertStmt.override=OVERRIDING_SYSTEM_VALUE
  target: lineage
  reach: [src.a.id -> tgt.t.id]
  sql: INSERT INTO tgt.t (id, v) OVERRIDING SYSTEM VALUE SELECT a.id, a.v FROM src.a AS a

- id: variant:InsertStmt.override=OVERRIDING_USER_VALUE
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (id, v) OVERRIDING USER VALUE SELECT a.id, a.v FROM src.a AS a

- id: clause:InsertStmt.returningClause
  covers: [node:ReturningClause]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (id, v) SELECT a.id, a.v FROM src.a AS a RETURNING id, v

- id: clause:UpdateStmt.returningClause
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: UPDATE tgt.t AS t SET v = a.v FROM src.a AS a WHERE a.id = t.id RETURNING t.id

- id: clause:DeleteStmt.returningClause
  target: lineage
  reach: [src.a.b -> relation:tgt.t]
  sql: DELETE FROM tgt.t AS t USING src.a AS a WHERE a.id = t.id AND a.b RETURNING t.id

- id: clause:MergeStmt.returningClause
  covers: [node:MergeSupportFunc]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    MERGE INTO tgt.t AS t USING src.a AS a ON t.id = a.id
    WHEN MATCHED THEN UPDATE SET v = a.v
    RETURNING merge_action(), t.id

- id: variant:ReturningOption.option=RETURNING_OPTION_OLD
  covers: [node:ReturningOption]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  note: PostgreSQL 18
  sql: UPDATE tgt.t AS t SET v = a.v FROM src.a AS a WHERE a.id = t.id RETURNING WITH (OLD AS o) o.v

- id: variant:ReturningOption.option=RETURNING_OPTION_NEW
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  note: PostgreSQL 18
  sql: UPDATE tgt.t AS t SET v = a.v FROM src.a AS a WHERE a.id = t.id RETURNING WITH (NEW AS nw) nw.v

- id: variant:MergeWhenClause.matchKind=MERGE_WHEN_MATCHED
  covers: [variant:MergeWhenClause.commandType=CMD_UPDATE]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: MERGE INTO tgt.t AS t USING src.a AS a ON t.id = a.id WHEN MATCHED AND a.b THEN UPDATE SET v = a.v

- id: variant:MergeWhenClause.matchKind=MERGE_WHEN_NOT_MATCHED_BY_TARGET
  covers: [variant:MergeWhenClause.commandType=CMD_INSERT]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: MERGE INTO tgt.t AS t USING src.a AS a ON t.id = a.id WHEN NOT MATCHED THEN INSERT (id, v) VALUES (a.id, a.v)

- id: variant:MergeWhenClause.matchKind=MERGE_WHEN_NOT_MATCHED_BY_SOURCE
  covers: [variant:MergeWhenClause.commandType=CMD_DELETE]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  note: PostgreSQL 17
  sql: |
    MERGE INTO tgt.t AS t USING src.a AS a ON t.id = a.id
    WHEN MATCHED THEN UPDATE SET v = a.v
    WHEN NOT MATCHED BY SOURCE AND t.d < (SELECT max(b.d) FROM src.b AS b) THEN DELETE

- id: variant:MergeWhenClause.commandType=CMD_NOTHING
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    MERGE INTO tgt.t AS t USING src.a AS a ON t.id = a.id
    WHEN MATCHED AND a.b THEN DO NOTHING
    WHEN MATCHED THEN UPDATE SET v = a.v

- id: variant:MergeWhenClause.override=OVERRIDING_SYSTEM_VALUE
  target: lineage
  reach: [src.a.id -> tgt.t.id]
  sql: MERGE INTO tgt.t AS t USING src.a AS a ON t.id = a.id WHEN NOT MATCHED THEN INSERT (id, v) OVERRIDING SYSTEM VALUE VALUES (a.id, a.v)

- id: variant:MergeWhenClause.override=OVERRIDING_USER_VALUE
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: MERGE INTO tgt.t AS t USING src.a AS a ON t.id = a.id WHEN NOT MATCHED THEN INSERT (id, v) OVERRIDING USER VALUE VALUES (a.id, a.v)

- id: extra:merge_source_subquery
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    MERGE INTO tgt.t AS t USING (SELECT a.id, sum(a.v) AS v FROM src.a AS a GROUP BY a.id) AS s ON t.id = s.id
    WHEN MATCHED THEN UPDATE SET v = s.v

