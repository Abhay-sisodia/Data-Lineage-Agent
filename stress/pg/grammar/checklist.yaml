- id: plpgsql:PLpgSQL_stmt_if
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    CREATE FUNCTION tgt.p_if(p_full boolean) RETURNS void LANGUAGE plpgsql AS $$
    BEGIN
      IF p_full THEN
        INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a;
      ELSIF p_full IS NULL THEN
        NULL;
      ELSE
        INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a WHERE a.b;
      END IF;
    END $$;

