- id: node:RangeTableSample
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a TABLESAMPLE SYSTEM (10) REPEATABLE (42)

- id: extra:values_in_from
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (n, v) SELECT m.label, a.v FROM src.a AS a JOIN (VALUES (1, 'one'), (2, 'two')) AS m(k, label) ON m.k = a.k

- id: extra:table_shorthand
  target: lineage
  reach: [src.b.v -> tgt.t.v]
