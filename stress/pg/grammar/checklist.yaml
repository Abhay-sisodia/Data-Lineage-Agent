# The PostgreSQL grammar checklist - one row per construct PostgreSQL's parser can produce.
#
# The construct list is NOT written here: `lineage.coverage.grammar.inventory()` reads it
# out of libpg_query (pglast). This file gives each item:
#
#   id      the inventory item (or `extra:<name>` for a combination worth its own row)
#   sql     a minimal snippet - PostgreSQL must accept it, and its parse tree must contain
#           `id` (both checked by tests/test_pg_checklist.py)
#   target  what the analyser SHOULD do with it:
#             lineage      column lineage; every `reach` pair must be among the edges
#             no_lineage   counted, nothing to trace (DDL, settings, grants, ...)
#             effect       changes what a table holds or is - an Operation fact (plan step 6)
#             refused:C / declared:K   honestly unknowable, named by code C / boundary K
#   reach   `source -> target` column pairs the lineage must include (lineage rows)
#
# What the analyser DOES with each snippet is measured, never written here: see
# stress/pg/grammar/measured.json and docs/pg-coverage.md (both generated by
# scripts/pg_coverage.py).
#
# Snippets read src.a / src.b and write tgt.t (stress/pg/grammar/schema.sql).

# ===========================================================================================
# Statements - data moving
# ===========================================================================================

- id: stmt:SelectStmt
  covers: [clause:SelectStmt.targetList, clause:SelectStmt.fromClause, node:ResTarget, node:RangeVar, node:ColumnRef, node:Alias, node:String]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a

- id: stmt:InsertStmt
  covers: [clause:InsertStmt.relation, clause:InsertStmt.cols, clause:InsertStmt.selectStmt]
  target: lineage
  reach: [src.a.n -> tgt.t.n]
  sql: INSERT INTO tgt.t (n) SELECT a.n FROM src.a AS a

- id: stmt:UpdateStmt
  covers: [clause:UpdateStmt.relation, clause:UpdateStmt.targetList, clause:UpdateStmt.fromClause, clause:UpdateStmt.whereClause]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: UPDATE tgt.t AS t SET v = a.v FROM src.a AS a WHERE a.id = t.id

- id: stmt:DeleteStmt
  covers: [clause:DeleteStmt.relation, clause:DeleteStmt.usingClause, clause:DeleteStmt.whereClause]
  target: lineage
  reach: [src.a.b -> relation:tgt.t]
  sql: DELETE FROM tgt.t AS t USING src.a AS a WHERE a.id = t.id AND a.b

- id: stmt:MergeStmt
  covers: [clause:MergeStmt.relation, clause:MergeStmt.sourceRelation, clause:MergeStmt.joinCondition, clause:MergeStmt.mergeWhenClauses, node:MergeWhenClause]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    MERGE INTO tgt.t AS t USING src.a AS a ON t.id = a.id
    WHEN MATCHED THEN UPDATE SET v = a.v
    WHEN NOT MATCHED THEN INSERT (id, v) VALUES (a.id, a.v)

- id: stmt:CreateTableAsStmt
  target: lineage
  reach: [src.a.v -> tgt.c.v]
  sql: CREATE TABLE tgt.c AS SELECT a.id, a.v FROM src.a AS a

- id: extra:create_materialized_view
  target: lineage
  reach: [src.a.v -> tgt.mv.v]
  sql: CREATE MATERIALIZED VIEW tgt.mv AS SELECT a.id, a.v FROM src.a AS a

- id: extra:select_into_new_table
  covers: [node:IntoClause, clause:SelectStmt.intoClause]
  target: lineage
  reach: [src.a.v -> tgt.si.v]
  sql: SELECT a.id, a.v INTO tgt.si FROM src.a AS a

- id: stmt:ViewStmt
  target: lineage
  reach: [src.a.v -> tgt.vw.v]
  sql: CREATE VIEW tgt.vw AS SELECT a.id, a.v FROM src.a AS a

- id: extra:create_recursive_view
  target: lineage
  reach: [src.a.id -> tgt.rv.id]
  sql: CREATE RECURSIVE VIEW tgt.rv (id) AS SELECT a.id FROM src.a AS a UNION ALL SELECT rv.id + 1 FROM tgt.rv WHERE rv.id < 3

- id: stmt:CopyStmt
  target: refused:SOURCE_UNAVAILABLE
  note: rows arrive from a file the analyser cannot see
  sql: COPY tgt.t (id, v) FROM '/data/t.csv' WITH (FORMAT csv)

- id: extra:copy_to_file
  target: no_lineage
  note: an export - nothing in the database changes
  sql: COPY (SELECT a.id, a.v FROM src.a AS a) TO '/data/a.csv' WITH (FORMAT csv)

- id: stmt:TruncateStmt
  target: effect
  sql: TRUNCATE tgt.t

- id: extra:delete_all_rows
  target: effect
  note: no predicate - every row goes, as TRUNCATE
  sql: DELETE FROM tgt.t

- id: stmt:RefreshMatViewStmt
  target: lineage
  reach: [src.a.v -> tgt.mv.v]
  note: re-runs the view's definition; the lineage is the definition's
  sql: |
    CREATE MATERIALIZED VIEW tgt.mv AS SELECT a.id, a.v FROM src.a AS a;
    REFRESH MATERIALIZED VIEW CONCURRENTLY tgt.mv;

- id: stmt:CallStmt
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    CREATE PROCEDURE tgt.p() LANGUAGE plpgsql AS $$
    BEGIN
      INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a;
    END $$;
    CALL tgt.p();

- id: stmt:CreateFunctionStmt
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    CREATE FUNCTION tgt.f() RETURNS void LANGUAGE plpgsql AS $$
    BEGIN
      INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a;
    END $$;

- id: extra:sql_function_body
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    CREATE FUNCTION tgt.load() RETURNS void LANGUAGE sql AS $$
      INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a
    $$;

- id: stmt:ReturnStmt
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    CREATE FUNCTION tgt.plus1(x numeric) RETURNS numeric LANGUAGE sql IMMUTABLE RETURN x + 1;
    INSERT INTO tgt.t (v) SELECT tgt.plus1(a.v) FROM src.a AS a;

- id: stmt:DoStmt
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    DO $$
    BEGIN
      INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a;
    END $$;

- id: stmt:PrepareStmt
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    PREPARE load_t(int) AS INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a WHERE a.k = $1;
    EXECUTE load_t(7);

- id: stmt:ExecuteStmt
  target: lineage
  reach: [src.a.n -> tgt.t.n]
  sql: |
    PREPARE load_n AS INSERT INTO tgt.t (n) SELECT a.n FROM src.a AS a;
    EXECUTE load_n;

- id: stmt:DeallocateStmt
  target: no_lineage
  sql: DEALLOCATE load_t

- id: stmt:CreateTrigStmt
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    CREATE FUNCTION tgt.audit_a() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN
      INSERT INTO tgt.t (id, v) VALUES (NEW.id, NEW.v);
      RETURN NEW;
    END $$;
    CREATE TRIGGER a_audit AFTER INSERT OR UPDATE ON src.a FOR EACH ROW EXECUTE FUNCTION tgt.audit_a();

- id: node:TriggerTransition
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    CREATE FUNCTION tgt.audit_new() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN
      INSERT INTO tgt.t (id, v) SELECT n.id, n.v FROM new_rows AS n;
      RETURN NULL;
    END $$;
    CREATE TRIGGER a_audit_new AFTER INSERT ON src.a REFERENCING NEW TABLE AS new_rows
      FOR EACH STATEMENT EXECUTE FUNCTION tgt.audit_new();

- id: stmt:RuleStmt
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  note: a rule rewrites every INSERT on src.a into a second write
  sql: CREATE RULE a_copy AS ON INSERT TO src.a DO ALSO INSERT INTO tgt.t (id, v) VALUES (NEW.id, NEW.v)

- id: stmt:DeclareCursorStmt
  target: no_lineage
  note: a client-side cursor - rows go to the client, not to a table
  sql: DECLARE c CURSOR FOR SELECT a.id FROM src.a AS a

- id: stmt:FetchStmt
  target: no_lineage
  sql: FETCH NEXT FROM c

- id: stmt:ClosePortalStmt
  target: no_lineage
  sql: CLOSE c

- id: stmt:ExplainStmt
  target: no_lineage
  note: plain EXPLAIN does not run the statement
  sql: EXPLAIN INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a

- id: extra:explain_analyze_runs_the_write
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  note: EXPLAIN ANALYZE executes the statement - the write happens
  sql: EXPLAIN ANALYZE INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a

# ===========================================================================================
# Statements - change what a table is (effects)
# ===========================================================================================

- id: stmt:DropStmt
  target: effect
  sql: DROP TABLE IF EXISTS tgt.t

- id: stmt:RenameStmt
  target: effect
  sql: ALTER TABLE tgt.t RENAME COLUMN v TO amount

- id: extra:rename_table
  target: effect
  sql: ALTER TABLE tgt.t RENAME TO t_old

- id: stmt:AlterTableStmt
  target: effect
  sql: ALTER TABLE tgt.t DROP COLUMN w

- id: extra:alter_column_type_using
  target: lineage
  reach: [tgt.t.n -> tgt.t.n]
  note: USING recomputes every row's value from its old one
  sql: ALTER TABLE tgt.t ALTER COLUMN n TYPE varchar(20) USING upper(n)

- id: extra:attach_partition
  target: effect
  note: the partition's rows become the parent's
  sql: ALTER TABLE tgt.t ATTACH PARTITION tgt.t_2026 FOR VALUES FROM ('2026-01-01') TO ('2027-01-01')

- id: extra:detach_partition
  target: effect
  sql: ALTER TABLE tgt.t DETACH PARTITION tgt.t_2026

- id: stmt:AlterObjectSchemaStmt
  target: effect
  sql: ALTER TABLE tgt.t SET SCHEMA src

- id: node:AlterTableCmd
  target: no_lineage
  sql: ALTER TABLE tgt.t ADD COLUMN extra text

- id: node:ATAlterConstraint
  target: no_lineage
  sql: ALTER TABLE tgt.t ALTER CONSTRAINT t_fk DEFERRABLE INITIALLY DEFERRED

- id: node:PartitionCmd
  target: effect
  sql: ALTER TABLE tgt.t DETACH PARTITION tgt.t_2025 CONCURRENTLY

