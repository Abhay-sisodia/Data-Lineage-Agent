    CREATE FUNCTION tgt.p_dyn_param(p_table text) RETURNS void LANGUAGE plpgsql AS $$
    BEGIN
      EXECUTE 'INSERT INTO ' || p_table || ' (v) SELECT a.v FROM src.a AS a';
    END $$;

- id: plpgsql:PLpgSQL_stmt_dynfors
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    CREATE FUNCTION tgt.p_dynfors() RETURNS void LANGUAGE plpgsql AS $$
    DECLARE r record;
    BEGIN
      FOR r IN EXECUTE 'SELECT a.id, a.v FROM src.a AS a' LOOP
        INSERT INTO tgt.t (id, v) VALUES (r.id, r.v);
      END LOOP;
    END $$;

- id: plpgsql:PLpgSQL_stmt_getdiag
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    CREATE FUNCTION tgt.p_diag() RETURNS void LANGUAGE plpgsql AS $$
    DECLARE n bigint;
    BEGIN
      INSERT INTO tgt.t (v) SELECT a.v FROM src.a AS a;
      GET DIAGNOSTICS n = ROW_COUNT;
      RAISE NOTICE '% rows', n;
    END $$;

- id: plpgsql:PLpgSQL_stmt_open
  covers: [plpgsql:PLpgSQL_stmt_fetch, plpgsql:PLpgSQL_stmt_close]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    CREATE FUNCTION tgt.p_cursor() RETURNS void LANGUAGE plpgsql AS $$
    DECLARE c refcursor; r record;
    BEGIN
      OPEN c FOR SELECT a.id, a.v FROM src.a AS a;
      LOOP
        FETCH c INTO r;
        EXIT WHEN NOT FOUND;
        INSERT INTO tgt.t (id, v) VALUES (r.id, r.v);
      END LOOP;
      CLOSE c;
    END $$;

