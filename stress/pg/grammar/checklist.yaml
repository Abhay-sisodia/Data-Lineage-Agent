  target: lineage
  reach: [src.a.k -> tgt.t.k, src.b.k -> tgt.t.k]
  note: the merged USING column is COALESCE of both sides in a FULL join
  sql: INSERT INTO tgt.t (k) SELECT k FROM src.a FULL JOIN src.b USING (k)

- id: extra:join_using_alias
  target: lineage
  reach: [src.a.k -> tgt.t.k]
  sql: INSERT INTO tgt.t (k) SELECT j.k FROM src.a JOIN src.b USING (k) AS j

- id: extra:natural_join
  target: lineage
  reach: [src.a.d -> tgt.t.d]
  note: an inner join's merged column is the left input's
  sql: INSERT INTO tgt.t (d) SELECT d FROM src.a NATURAL JOIN src.b

- id: extra:cross_join
  target: lineage
  reach: [src.b.n -> tgt.t.n]
  sql: INSERT INTO tgt.t (v, n) SELECT a.v, b.n FROM src.a AS a CROSS JOIN src.b AS b

- id: extra:implicit_join_in_where
  target: lineage
  reach: [src.b.n -> tgt.t.n]
  sql: INSERT INTO tgt.t (v, n) SELECT a.v, b.n FROM src.a AS a, src.b AS b WHERE b.id = a.id

- id: extra:only_and_inheritance_star
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (v) SELECT x.v FROM ONLY src.a AS x UNION ALL SELECT y.v FROM src.a * AS y

- id: node:RangeSubselect
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (v) SELECT s.v FROM (SELECT a.v FROM src.a AS a) AS s

- id: extra:lateral_subquery
  target: lineage
  reach: [src.b.v -> tgt.t.v]
  sql: INSERT INTO tgt.t (k, v) SELECT a.k, l.v FROM src.a AS a CROSS JOIN LATERAL (SELECT b.v FROM src.b AS b WHERE b.k = a.k ORDER BY b.d DESC LIMIT 1) AS l

- id: node:RangeFunction
  target: lineage
  reach: [src.a.arr -> tgt.t.k]
  sql: INSERT INTO tgt.t (k) SELECT u.e FROM src.a AS a CROSS JOIN LATERAL unnest(a.arr) AS u(e)

- id: extra:rows_from_with_ordinality
  target: lineage
  reach: [src.a.arr -> tgt.t.k]
  sql: INSERT INTO tgt.t (k, id) SELECT u.e, u.ord::int FROM src.a AS a, ROWS FROM (unnest(a.arr)) WITH ORDINALITY AS u(e, ord)

- id: extra:rows_from_several_functions
  target: lineage
  reach: [src.a.arr -> tgt.t.k]
  note: valid PostgreSQL SQLGlot cannot parse - found in plan step 4
  sql: INSERT INTO tgt.t (k) SELECT g.y FROM src.a AS a, LATERAL ROWS FROM (generate_series(1, 2), unnest(a.arr)) AS g(x, y)

- id: extra:generate_series_source
  target: lineage
  reach: [src.a.d -> tgt.t.d]
