        ELSE NULL;
      END CASE;
    END $$;

- id: plpgsql:PLpgSQL_stmt_loop
  covers: [plpgsql:PLpgSQL_stmt_exit]
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    CREATE FUNCTION tgt.p_loop() RETURNS void LANGUAGE plpgsql AS $$
    DECLARE i int := 0;
    BEGIN
      LOOP
        i := i + 1;
        EXIT WHEN i > 3;
        CONTINUE WHEN i = 2;
        INSERT INTO tgt.t (k, v) SELECT i, a.v FROM src.a AS a;
      END LOOP;
    END $$;

- id: plpgsql:PLpgSQL_stmt_while
  target: lineage
  reach: [src.a.v -> tgt.t.v]
  sql: |
    CREATE FUNCTION tgt.p_while() RETURNS void LANGUAGE plpgsql AS $$
    DECLARE i int := 0;
    BEGIN
      WHILE i < 3 LOOP
        INSERT INTO tgt.t (k, v) SELECT i, a.v FROM src.a AS a;
        i := i + 1;
      END LOOP;
    END $$;

