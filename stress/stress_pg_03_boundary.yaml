# ====================================================================================
# THE WRONG ANSWERS THIS FILE INVITES - all of them the same wrong answer, in four
# costumes: an edge claimed from text the analyser has DECLARED IT CANNOT READ.
#
# This is the worst failure available here, and worse than a miss. A refusal followed by an
# edge from the refused text is a contradiction stated as fact: the output says both "I
# cannot read this" and "here is what it does". Whichever a reader believes, the analyser
# has told them something false.
# ====================================================================================

forbidden:
  - source: {kind: column, name: stg_orders.gross_amount}
    target: {kind: column, name: fct_revenue.net_amount}
    flow: value
    reason: >
      The INSERT inside the PL/pgSQL body at statement 1. It is ordinary SQL and it is
      genuinely there - which is exactly why this is the tempting edge. The body is a
      dollar-quoted string literal that the analyser has refused, and recovering SQL out of
      a literal it declared unreadable would make the refusal a lie. `fct_revenue` is
      written NOWHERE ELSE in this file, so this edge cannot arrive by any legitimate route.

  - source: {kind: column, name: stg_orders.cust_id}
    target: {kind: column, name: fct_revenue.cust_id}
    flow: value
    reason: >
      The same body, by its simplest projection. Listed separately because an analyser that
      recovered only the identity bindings and not the aggregate would produce this one
      alone, and a single edge is easier to miss than a cluster.

  - source: {kind: column, name: dim_customer.region}
    target: {kind: column, name: dim_customer.is_active}
    flow: value
    reason: >
      Trigger inheritance invented for the CREATE TRIGGER at statement 7. In ORACLE this
      exact edge is real and is inherited from the dictionary - which is what makes it the
      plausible wrong answer here. In PostgreSQL the body lives in log_customer_change(),
      the trigger is refused, and the dictionary holds no trigger at all. There is nothing
      to inherit, and inheriting it anyway would be Oracle's answer given to a PostgreSQL
      question.

  - source: {kind: column, name: stg_orders.order_id}
    target: {kind: relation, name: stg_orders}
    flow: filter
    reason: >
      The COPY's column list read as lineage. `COPY stg_orders (order_id, cust_id,
      gross_amount) FROM ...` names three columns, and they are the columns the file
      populates - so a reading that treats the list as structure rather than as an
      unreadable boundary produces something almost right. The rows come from a CSV no
      static analysis can see; naming the columns without their source is the shape of an
      answer without the substance of one.

# ====================================================================================
# WHAT THIS FILE DECLARES IT CANNOT SEE - the point of the package.
#
# Five refusals, each named in advance with the code docs/postgres_scope.md gives it. The
# LINE component of each subject is a prediction; see the header.
# ====================================================================================

expected_boundaries:
  - kind: refusal
    subject: "<script>:1"
    reason: >
      The PL/pgSQL routine body of refresh_revenue(). UNSUPPORTED_CONSTRUCT - the body is a
      dollar-quoted string literal, not part of the SQL parse tree, and no PL/pgSQL grammar
      has been chosen (ADR-0002 section 5). The INSERT inside it is ordinary SQL and is
      invisible for exactly that reason: this refusal IS the cost of the parked decision.

  - kind: refusal
    subject: "<script>:55"
    reason: >
      The anonymous DO block. UNSUPPORTED_CONSTRUCT, for the same reason as the routine
      body and without even a name to attribute the lost edges to.

  - kind: refusal
    subject: "<script>:79"
    reason: >
      COPY. SOURCE_UNAVAILABLE, and deliberately a DIFFERENT code from the other four: the
      rows come from outside the database entirely. A PL/pgSQL grammar would recover every
      other refusal in this file and would never recover this one, so filing them under one
      code would misstate what is fixable.

  - kind: refusal
    subject: "<script>:97"
    reason: >
      CREATE TRIGGER. UNSUPPORTED_CONSTRUCT - a PostgreSQL trigger names a FUNCTION that
      holds the body. Oracle triggers are handled and deliberately NOT refused, which is
      why this construct is scoped to one dialect.

  - kind: refusal
    subject: "<script>:109"
    reason: >
      TRUNCATE. UNSUPPORTED_CONSTRUCT - no column has a source to name, but the statement
      decides what gtt_stage contains afterwards, so it is recorded rather than skipped.
      Skipping it is how a table acquires its contents with no writer.

  - kind: context_dependent_binding
    subject: "<script>:1"
    reason: >
      Unqualified names resolve through whichever schema executes this script.
