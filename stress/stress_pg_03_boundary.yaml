# Ground truth for stress/stress_pg_03_boundary.sql
#
# WRITTEN FROM SOURCE, BEFORE THE ANALYSER WAS RUN OVER THIS FILE.
#
# THIS KEY MEASURES CONTAINMENT, which is a different question from the other two packages.
# Five statements are out of scope and four are in scope, and they ALTERNATE. Every in-scope
# statement here is the kind that passes cleanly in stress_pg_01, so a miss on one of them
# is not a construct-coverage gap - it is a refusal that failed to stay where it was put.
#
# THE REFUSAL SUBJECTS WERE A PREDICTION AND THEIR LINE COMPONENT WAS WRONG. Filed as PG-07.
#
# The first draft hand-read each line from the SQL itself - 36, 59, 84, 104, 116. The
# splitter anchors a statement at the start of its BLOCK, comment header included, so the
# analyser says 1, 55, 79, 97, 109. All five subjects read NOT DECLARED.
#
# Corrected above, and the correction is narrow enough to state exactly. WHAT WAS PREDICTED
# CORRECTLY: which five statements are refused, and the code each one carries - four
# UNSUPPORTED_CONSTRUCT and one SOURCE_UNAVAILABLE, matched one for one. That is the
# substantive claim of this package and it held. WHAT WAS WRONG: a numbering convention this
# key had no way to know, which is a fact about the splitter and not about the SQL.
#
# That distinction is the reason this edit is not the thing the rules forbid. Copying an
# ANSWER out of the output would make the key agree with the code by construction; adopting
# the analyser's own statement NUMBERING is adopting a coordinate system. Tagged and left
# visible either way, because "it was only a convention" is exactly what someone laundering
# a real disagreement would also say.
#
# WHAT A REFUSAL IS WORTH, stated because the numbers below look like failure and are not.
# A refusal is a DELIVERABLE: it is counted against parse coverage, it carries a code and a
# reason, and it tells a reader precisely which facts are missing and why. Four of the five
# here carry UNSUPPORTED_CONSTRUCT and one carries SOURCE_UNAVAILABLE, and the difference is
# load-bearing: a grammar decision would recover the first four and would never recover the
# COPY, whose rows come from outside the database entirely.

# NO LABELS: REFRESH_REVENUE
#
# The one program unit in this file, and it contributes no labels BECAUSE IT IS REFUSED -
# which is the package's whole subject rather than an omission. Its body holds a perfectly
# ordinary `INSERT INTO fct_revenue ... SELECT`, and that INSERT is the most tempting wrong
# answer in this file: the `forbidden` list names two of its edges by hand.
#
# Declared explicitly because `tests/test_stress_keys.py` requires every unit to be labelled
# or to have its emptiness stated - the rule that exists because finding S2-06 had ten
# unlabelled units whose CORRECT edges scored as false positives against the key's own
# silence, and read in the report as an analyser defect. Here the distinction is sharper
# still: an edge from this unit would mean the refusal was a lie.

