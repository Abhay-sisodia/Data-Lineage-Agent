# Ground truth for stress/stress_01_wide_coverage.sql
#
# WRITTEN FROM SOURCE, BEFORE THE ANALYSER WAS RUN OVER THIS FILE. That ordering is the
# only thing that makes the result mean anything: if the key is written after seeing the
# output, it records what the analyser did rather than what is true, and the exercise
# becomes a very expensive way of agreeing with yourself.
#
# Every label here is `source_read`. The package is parse-only - nothing was executed, no
# database observed it - so this key carries LESS authority than the phase-0 corpus, where
# 92 of 258 labels are anchored in observed database change. Stated up front because
# `source_read` is exactly the provenance that lets an author's misunderstanding score
# 100%, and a stress test is where that is most likely.
#
# CONVENTIONS APPLIED (all pre-existing, none invented here):
#   * match key is (source, target, flow, transform)  - ADR-0001 4
#   * a filter edge targets the relation the STATEMENT WRITES; when the statement writes a
#     variable, it targets the relation read (b1_03 does both)
#   * join conditions `ON a.x = b.x` are structural, not filter lineage
#   * COUNT(*) and literals produce no edge - there is no upstream to name
#   * a window function's PARTITION BY / ORDER BY are not value sources; its ARGUMENT is
#   * a correlated predicate decides WHICH row, so it is filter, not value
#   * band is the hardest construct on the path: set-based 0, variable/cursor/loop 1,
#     dynamic SQL and triggers 2
#
# WHERE THIS KEY IS UNCERTAIN, IT SAYS SO in a note rather than picking the answer that
# would score best. Three constructs have no precedent in the phase-0 corpus - HAVING,
# BULK COLLECT/FORALL, and MERGE against a subquery source - and they are flagged.

