expected_boundaries:
  - kind: dynamic_sql
    subject: "EXECUTE IMMEDIATE:267"
    reason: >
      v_sql_bad is assembled from a parameter, so the target column is not statically
      decidable and no edge may be claimed for it.

  - kind: suppressed_error
    subject: "STRESS_BULK_OPERATIONS:291"
    reason: >
      WHEN OTHERS THEN NULL swallows every failure in the bulk load, so the absence of an
      edge below it proves nothing about whether the write happened.

  - kind: cross_unit_state
    subject: "APPLY_WINDOW"
    reason: >
      g_cutoff and g_region are read here and assigned in set_window. The edge is real and
      the call ORDER is a condition on it that no static reading can settle.
