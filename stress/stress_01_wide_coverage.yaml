# ====================================================================================
# THE WRONG ANSWERS THIS FILE INVITES. Named in advance, because a wrong edge that
# happens to be absent from the key is only ever one anonymous false positive among
# others - and naming it changes what a regression means.
# ====================================================================================

forbidden:
  - source: {kind: column, name: STG_ORDERS.ORDER_ID}
    target: {kind: column, name: FCT_REVENUE.NET_AMOUNT}
    flow: value
    reason: >
      The UDF's ARGUMENT read as a value source. fn_stress_net(o.order_id) returns a value
      derived from line_amount and discount_amt; order_id only selects which order. This
      exact error has appeared four times in this project.

  - source: {kind: column, name: STG_ORDERS.CUST_ID}
    target: {kind: column, name: DIM_CUSTOMER_HIER.ROOT_NAME}
    flow: value
    reason: >
      The scalar subquery resolved against the OUTER scope instead of its own. root_name
      comes from stg_products and nothing in the outer query feeds it.

  - source: {kind: column, name: FCT_PRODUCT_SALES.PERIOD_MONTH}
    target: {kind: column, name: FCT_PRODUCT_SALES.RANK_IN_MONTH}
    flow: value
    reason: >
      A window function's PARTITION BY read as a value source. ROW_NUMBER() takes no
      column argument at all, so rank_in_month has no upstream - inventing one from the
      partition key is the defect the complex-SQL band already caught once.

  - source: {kind: column, name: STG_CUSTOMER.CUST_ID}
    target: {kind: column, name: DIM_CUSTOMER.EMAIL}
    flow: value
    reason: >
      The MERGE's ON condition read as value lineage. cust_id matches rows; email is what
      is written, and joining on one does not make it the source of the other.

  - source: {kind: column, name: STG_ORDERS.GROSS_AMOUNT}
    target: {kind: column, name: DIM_CUSTOMER.LIFETIME_VALUE}
    flow: value
    reason: >
      Path fusion through tmp_recent. stg_customer feeds tmp_recent and trg_recent_audit
      reads tmp_recent, but lifetime_value is derived from its OWN prior value - nothing
      upstream of tmp_recent supplies it. Composing at emission time is how an unprovable
      edge acquires a provable-looking origin.

  - source: {kind: variable, name: V_SQL_BAD}
    target: {kind: column, name: DIM_CUSTOMER.IS_ACTIVE}
    flow: value
    reason: >
      Guessing the target of the non-constant EXECUTE IMMEDIATE. `'UPDATE dim_customer SET
      ' || p_column` has constant fragments and a variable in the middle; folding the
      parts that are available and assuming a column is the plausible-wrong-answer failure
      this whole project is organised against.

