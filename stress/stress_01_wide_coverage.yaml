# ------------------------------------------------------------------------------------
# FIVE FACTS THIS KEY CANNOT STATE, AND THE VALIDATOR CAUGHT THEM (2026-09-09).
#
# The first draft of this key was REJECTED by `labels._reject_duplicates`. Five genuine
# facts, each written by two different procedures in this one file, collide on the match
# key - and unlike b1_02/b1_03/b1_09/s7, GUARD DOES NOT SEPARATE THEM. All ten edges are
# unconditional. Only origin distinguishes them, and origin was measured out of the key
# (ADR-0001 amendment 1b).
#
#   STG_ORDERS.CUST_ID    -> FCT_REVENUE.CUST_ID       stress_set_ops : stress_udf_caller
#   STG_ORDERS.ORDER_DATE -> FCT_REVENUE.PERIOD_MONTH  stress_set_ops : stress_udf_caller
#   STG_ORDERS.CURRENCY   -> FCT_REVENUE (filter)      stress_set_ops : stress_udf_caller
#   STG_CUSTOMER.EMAIL    -> DIM_CUSTOMER.EMAIL        stress_merge_upsert : stress_cursor_for_loop
#   DIM_CUSTOMER.CUST_ID  -> DIM_CUSTOMER (filter)     trg_recent_audit : stress_cursor_for_loop
#
# Two of them differ in BAND as well (0 against 1, and 1 against 2), so the collision is
# not cosmetic: it forces a choice about which band the fact is scored in, and the losing
# band's recall is charged for a fact that is genuinely there.
#
# THIS IS THE FINDING, NOT AN INCONVENIENCE. Amendment 1b concluded origin has no useful
# role in the scoring layer, and it was right about the phase-0 corpus - where every
# package holds one to three procedures and two of them almost never write the same thing.
# This file holds thirteen units, which is ordinary for real code, and the collision
# appears immediately. The conclusion does not survive contact with package size.
#
# Kept as the FIRST occurrence in source order, deliberately rather than by picking
# whichever copy the analyser's dedup happens to keep - tuning a key to an implementation
# is how a benchmark stops measuring anything.
# ------------------------------------------------------------------------------------

