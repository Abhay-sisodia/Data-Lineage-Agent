      order_count <- literal 1, no edge.

      WORTH SAYING PLAINLY, BECAUSE IT IS THE S2-03 ARGUMENT AGAIN: this particular rule
      is `net_amount[ANY] = net_amount[CV()] * 1.1`, which reads only the cell of the row
