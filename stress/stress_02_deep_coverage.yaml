      COMPLETION, 2026-09-10, under finding S2-09, AND IT RAISES PRECISION - stated for
      that reason.

      `VALUES (p_cust_id, v_parent, p_depth)` binds three columns and this key labelled
      two. p_depth is a parameter, which ADR-0001 §3 makes a first-class node, and it is
      written into `depth` by exactly the rule that makes the two edges above true. There
      is no reading of the statement under which two of its three bindings are lineage and
      the third is not.

      The omission is the same shape as `s2_pivot_static` under S2-03: the unit was
      expected to be REFUSED, so the key was written to size the refusal and not to be
      complete, and the gap only became visible when the statement started producing
      edges. Third instance of that shape - see S1-06 and S2-06.

      Not to be confused with unit 1, where `depth` receives the recursive CTE's literal 1
      and correctly has no source.

  # === 21. s2_dynamic_in_loop ===============================================
  # EXPECTED TO BE REFUSED, and the refusal is CORRECT - the text is assembled from
  # the loop counter, so it is a different statement on every pass and constant on
  # none. Declared in expected_boundaries. Labelled in full because the cost of a
  # correct abstention is still a cost, and a key that only sizes the wrong refusals
  # cannot tell you what abstaining is buying.
  # Band 2 throughout: the path runs through EXECUTE IMMEDIATE either way.

  # UNSTATABLE (S1-05), the three value facts, all held already at band 0 by unit 3:
  #   STG_ORDERS.CUST_ID       -> GTT_STAGE.CUST_ID     [value/identity]
  #   STG_ORDERS.ORDER_DATE    -> GTT_STAGE.PERIOD_MONTH[value/derived]
  #   STG_ORDERS.GROSS_AMOUNT  -> GTT_STAGE.AMOUNT      [value/identity]
  #
  # THE BAND IS THE WHOLE POINT HERE AND THE KEY CANNOT CARRY IT. These three are band
  # 2 - the path runs through EXECUTE IMMEDIATE - and the surviving band-0 copies say
  # the same four columns move for reasons that have nothing to do with dynamic SQL.
  # Band 2 value recall is measured on 2 labels in this file; three more belong to it
  # and cannot be added. That is a direct answer to the question S1-05 was raised to
  # ask: the collision does not merely lose facts, it biases which BAND gets measured.

  - source: {kind: column, name: STG_ORDERS.CUST_ID}
    target: {kind: relation, name: GTT_STAGE}
    flow: filter
    transform: identity
    band: 2
    origin: {unit: S2_DYNAMIC_IN_LOOP, line: 581}
    evidence: source_read
    note: >
      `WHERE cust_id = ' || TO_CHAR(i)`. The column-level shape is the same on all three
      passes - only the literal changes - which is what makes this the hard case rather
      than the obvious one. It is still not constant, and constant-ness is a MUST.

  # === 22. s2_three_way_resolution ==========================================
  # The same base table reached three ways in one statement: through the three-deep
  # view chain, through v_recent_raw, and directly. All three must land on
  # stg_customer or the resolver disagrees with itself.
  # Join conditions (w.cust_id = v.cust_id, s.cust_id = v.cust_id) are structural.

  # NO LABELS: S2_THREE_WAY_RESOLUTION - every one of its four facts is already held
  # by another unit writing the same table, so the key states none of them:
  #
  #   STG_CUSTOMER.CUST_ID    -> TMP_RECENT.CUST_ID    [value/identity]   - unit 3
  #     v_cust_l3.cust_id <- v_cust_l2.cust_id <- v_cust_l1.id <- stg_customer.cust_id
  #   STG_CUSTOMER.LAST_LOGIN -> TMP_RECENT.LAST_LOGIN [value/identity]   - unit 3
  #     renamed twice en route - last_login <- login_ts <- last_login - still identity
  #   STG_CUSTOMER.STATUS_CODE-> relation:TMP_RECENT   [filter/identity]  - unit 3
  #   STG_CUSTOMER.LAST_LOGIN -> relation:TMP_RECENT   [filter/identity]  - unit 13
  #     w.last_login IS NOT NULL, through v_recent_raw
  #
  # AND THE STATUS_CODE FILTER COLLIDES WITH ITSELF, INSIDE ONE STATEMENT. `v.status_flag
  # = 1` resolves through the CASE in v_cust_l2 down to status_code; `s.status_code = 'A'`
  # names it directly. b0_04 fixes the transform on the view-chain half as `identity` -
  # a filter's transform describes the edge, not the expression that computed the
  # predicate - so the two are one four-tuple even before any other unit is considered.
  #
  # The unit was written to test that three routes to one base table resolve to the same
  # place. It cannot fail this key and it cannot pass it: the labels that would show the
  # resolver agreeing with itself are the labels the key cannot hold. Join conditions
  # (w.cust_id = v.cust_id, s.cust_id = v.cust_id) are structural and contribute nothing.

  # === 23. s2_unpivot_listagg ===============================================
