  # === 24. s2_keep_dense_rank ===============================================

  - source: {kind: column, name: STG_PRODUCTS.PRODUCT_NAME}
    target: {kind: column, name: FCT_PRODUCT_SALES.CATEGORY_NAME}
    flow: value
    transform: aggregated
    band: 0
    origin: {unit: S2_KEEP_DENSE_RANK, line: 649}
    evidence: source_read
    note: >
      MAX ... KEEP (DENSE_RANK FIRST ORDER BY line_amount). The ORDER BY picks WHICH row
      the value comes from, so line_amount is a filter influence on this column and not a
      source of its value - the same distinction as a window ORDER BY.

  - source: {kind: column, name: STG_ORDER_LINES.LINE_AMOUNT}
    target: {kind: column, name: FCT_PRODUCT_SALES.CATEGORY_NAME}
    flow: influence
    transform: identity
    band: 0
    origin: {unit: S2_KEEP_DENSE_RANK, line: 649}
    evidence: source_read
    note: >
      ADDED 2026-09-10 under D-4, AND THE KEY ALREADY ARGUED FOR IT - see the note
      directly above, written when this unit was first labelled: "line_amount is a filter
      influence ON THIS COLUMN and not a source of its value".

      That sentence could not be turned into a label. A filter edge targets the RELATION,
      so "on this column" was unsayable and the fact was left in prose. D-4 gives it a
      form, and this is the third independent argument for the decision - after the two in
      `sq_03` and stress 1 - all of them written down before the decision existed.

      `KEEP (DENSE_RANK FIRST ORDER BY ...)` is not a window function and behaves like one
      here, which is worth noting: the rule is about ORDERING CHOOSING A ROW, not about
      the `OVER` keyword.

  # === 25. s2_row_limiting ==================================================
  # ROWNUM and FETCH FIRST limit the result set without depending on any column, so
  # neither invents an edge - the convention this key inherited from stress 1.
  # The ORDER BY under FETCH FIRST decides WHICH fifty rows survive, which is close
  # to a filter; it is left unlabelled for the same reason a window ORDER BY is, and
  # the two must move together if that convention is ever revisited.

  # NO LABELS: S2_ROW_LIMITING - all six of its facts are held already:
  #
  #   STG_CUSTOMER.CUST_ID     -> TMP_RECENT.CUST_ID     [value/identity]   - unit 3
  #   STG_CUSTOMER.LAST_LOGIN  -> TMP_RECENT.LAST_LOGIN  [value/identity]   - unit 3
  #   STG_CUSTOMER.STATUS_CODE -> relation:TMP_RECENT    [filter/identity]  - unit 3
  #     s.status_code = 'A'; the ROWNUM <= 100 beside it contributes nothing
  #   STG_ORDERS.CUST_ID       -> GTT_STAGE.CUST_ID      [value/identity]   - unit 3
  #   STG_ORDERS.ORDER_DATE    -> GTT_STAGE.PERIOD_MONTH [value/derived]    - unit 3
  #   STG_ORDERS.GROSS_AMOUNT  -> GTT_STAGE.AMOUNT       [value/identity]   - unit 3
  #
  # What this unit exists to check is a NEGATIVE - that ROWNUM and FETCH FIRST invent no
  # column dependency - and a negative is checked by the absence of a spurious edge, not
  # by a label. So the unit still does its job through the SPURIOUS list, and states
  # nothing in the key. Worth knowing which of the two a unit is before writing it.

  # === 26. s2_truncate_reload ===============================================
  # TRUNCATE is DDL and writes no lineage - but the table's entire prior contents
  # are gone, which is a fact about gtt_stage that no DML-only reading contains.
  # It is dynamic and constant, so it should be RECOVERED and then found to carry
  # no column lineage. Recovering it and emitting nothing, and never seeing it at
  # all, are the same output and different facts - the S2-04 shape in DDL form.
  # The GROUP BY columns are NOT labelled: S1-03's convention, two more predicted
  # false positives.

  # NO LABELS: S2_TRUNCATE_RELOAD - all three of its facts are held already:
  #
  #   STG_ORDERS.CUST_ID      -> GTT_STAGE.CUST_ID      [value/identity]    - unit 3
  #   STG_ORDERS.ORDER_DATE   -> GTT_STAGE.PERIOD_MONTH [value/derived]     - unit 3
  #   STG_ORDERS.GROSS_AMOUNT -> GTT_STAGE.AMOUNT       [value/aggregated]  - unit 19, `stage`
  #
  # The fact this unit was written to raise - that TRUNCATE destroys gtt_stage's entire
  # prior contents, which no DML-only reading contains - has no edge shape at all. It is
  # not a column dependency and the key has no room for it. Recorded as an IR gap rather
  # than a label: the s4 shape, arriving in DDL.

