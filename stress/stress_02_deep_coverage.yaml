      1's rows survive. The key labelled `cust_id` and stopped. There is no reading under
      which one column of a three-column MINUS constrains and the other two do not - a row
      is removed when ALL THREE match, so if anything the other two are doing more work
      than the one that was labelled.

      Same shape as S1-06, S2-09 and S2-11: a uniform rule applied to the first instance
      and not the rest. Fourth time in this register, and the first three were found by
      three different mechanisms - none of which would have caught this one.

