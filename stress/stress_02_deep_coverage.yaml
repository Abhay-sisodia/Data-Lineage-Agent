forbidden:
  - source: {kind: column, name: STG_ORDER_LINES.LINE_AMOUNT}
    target: {kind: column, name: FCT_PRODUCT_SALES.RANK_IN_MONTH}
    flow: value
    reason: >
      A window ORDER BY read as a value source. RANK() takes no argument; the ORDER BY
      decides the ranking, not the value. Same defect the complex-SQL band caught once.

  - source: {kind: column, name: STG_ORDERS.ORDER_DATE}
    target: {kind: column, name: FCT_PRODUCT_SALES.PRIOR_MONTH}
    flow: value
    reason: >
      DENSE_RANK()'s ORDER BY read as a value source. prior_month receives a rank number
      derived from no column at all.

  - source: {kind: column, name: STG_CUSTOMER.CUST_ID}
    target: {kind: column, name: TMP_RECENT.LAST_LOGIN}
    flow: value
    reason: >
      The INTERSECT's arms bound by NAME rather than by position. Arm 2 selects
      (cust_id, SYSDATE); reading the alias instead of the position puts cust_id into
      last_login. The s5 failure in the top-level form.

  - source: {kind: column, name: STG_ORDERS.ORDER_ID}
    target: {kind: column, name: DIM_CUSTOMER.LIFETIME_VALUE}
    flow: value
    reason: >
      The EXISTS join key read as a value source. order_id links lines to orders inside
      the predicate; lifetime_value comes from the correlated SUM in the SET clause.

  - source: {kind: column, name: FCT_REVENUE.NET_AMOUNT}
    target: {kind: column, name: GTT_STAGE.PERIOD_MONTH}
    flow: value
    reason: >
      UNPIVOT's measure column bound to the wrong output. The unpivoted value feeds
      `amount`; period_month is a literal TRUNC(SYSDATE) and has no source.

  - source: {kind: column, name: STG_CUSTOMER.STATUS_CODE}
    target: {kind: column, name: DIM_CUSTOMER.IS_ACTIVE}
    flow: value
    transform: identity
    reason: >
      The nested CASE flattened to identity. Two CASE expressions stack in
      s2_nested_expressions, and reporting the transform as a copy would say the value
      passes through unchanged when it is being recoded twice. Wrong transform is a MISS
      under ADR-0001 4, and this states the wrong answer explicitly.

expected_boundaries:
  - kind: refusal
    subject: "S2_HIERARCHICAL:445"
    reason: >
      CONNECT BY generates rows by walking a relationship, so a column's value can come
      from a row that exists in no base table.

  - kind: refusal
    subject: "S2_MODEL_CLAUSE:712"
    reason: >
      MODEL computes cells from other cells of the same result set. The source of a value
      may be a row that does not exist in any base table.

  - kind: dynamic_sql
    subject: "EXECUTE IMMEDIATE:581"
    reason: >
      Assembled inside a loop from the loop counter, so it is a different statement on
      every pass and constant on none. Constant-ness is a MUST property.

  - kind: dangling_reference
    subject: "REMOTE_CUSTOMER@CRM_LINK"
    reason: >
      ADDED 2026-09-09 under S2-06, with unit 18's labels. The database link target is out
      of coverage, so everything upstream of remote_customer is permanently invisible. The
      projection across it is still readable and is labelled; the boundary is what makes
      the difference between a partial answer and a quiet one. Same treatment as b2_06.

  - kind: cross_unit_state
    subject: "PUBLISH"
    reason: >
      g_cutoff is read three call levels below where it is assigned, and which overload of
      `load` ran decides its value.
