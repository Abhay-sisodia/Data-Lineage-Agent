# Ground truth for stress/stress_02_deep_coverage.sql
#
# WRITTEN FROM SOURCE, BEFORE THE ANALYSER WAS RUN OVER IT. Same rule as stress 1 and the
# phase-0 corpus: a key written after seeing the output records what the analyser did
# rather than what is true.
#
# All source_read. Parse-only, nothing executed.
#
# CONVENTIONS CARRIED FROM STRESS 1 (none invented, except where flagged):
#   * match key is (source, target, flow, transform)
#   * a filter edge targets the relation the STATEMENT WRITES; when the statement writes a
#     variable, it targets the relation read
#   * join conditions are structural, not filter lineage
#   * literals, COUNT(*), ROWNUM and FETCH FIRST produce no edge - no upstream to name
#   * a window function's ARGUMENT is a value source; its PARTITION BY and ORDER BY are not
#   * a correlated or IN/EXISTS predicate decides WHICH row, so it is filter, not value
#   * transform is the STRONGEST on the path: aggregated > conditional > derived > identity
#   * band: set-based 0, variable/cursor/loop 1, dynamic SQL and triggers 2
#
# THREE CONVENTIONS HAVE NO PRECEDENT AND ARE PROPOSED HERE, flagged in place:
#   (a) INTERSECT / MINUS second arm contributes FILTER, not value. The output values all
#       come from the first arm; the second decides which rows survive.
#   (b) UNPIVOT feeds one output column from several input columns - so several value
#       edges into one target, which is the reverse of every other construct here.
#   (c) A DELETE writes no lineage, but its predicate columns are a real dependency of the
#       resulting table state. Labelled as filter edges against the deleted relation.
#
# WHERE A UNIT IS EXPECTED TO BE REFUSED the labels are still written out in full. A
# refusal that loses ten edges and a refusal that loses one are different facts, and only
# a complete key can tell them apart.

