      cell of the result set, including one no base row produced - and the refusal is the
      right default. But the same over-refusal question PIVOT turned out to have is live
      here, and if it is ever taken up the test is `CV()` versus an arbitrary subscript.
      Not raised as a finding: one construct, no recurrence, and the refusal is honest.

  # === 28. s2_goto_flow =====================================================

  - source: {kind: variable, name: V_FLAG}
    target: {kind: column, name: DIM_CUSTOMER.IS_ACTIVE}
