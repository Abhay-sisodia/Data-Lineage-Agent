# Ground truth for stress/stress_pg_01_wide_coverage.sql
#
# WRITTEN FROM SOURCE, BEFORE THE ANALYSER WAS RUN OVER THIS FILE. The same rule the Oracle
# keys were written under, and the only thing that makes the result mean anything: a key
# written after seeing the output records what the analyser did rather than what is true.
#
# PROVENANCE, AND IT IS ONE STEP WEAKER THAN THE ORACLE STRESS KEYS. Every label is
# `source_read`, as in stress_01 - but these also bind against a SYNTHETIC dictionary
# (stress/dictionary_postgres.md). The Oracle packages reference objects that were observed
# to exist in a live XE; these reference objects that were asserted to exist. Stated up
# front because provenance that cannot be stated is not evidence.
#
# LOWER CASE, AND THE CASE IS LOAD-BEARING. PostgreSQL folds unquoted identifiers down and
# `dialects.fold` follows it, so `STG_ORDERS.CUST_ID` here would match nothing and would
# read as a total miss rather than as a mis-cased key. The Oracle keys are UPPER for exactly
# the same reason in the other direction.
#
# BAND 0 THROUGHOUT, and that is a statement about the scope rather than about this file. A
# PL/pgSQL body is refused (ADR-0002 section 5), so PostgreSQL has no variable def-use, no
# cursors and no trigger inheritance. A band-1 label in a PostgreSQL key would claim a
# capability `docs/postgres_scope.md` says does not exist.
#
# CONVENTIONS APPLIED (all pre-existing; the one NEW question is flagged at statement 3):
#   * match key is (source, target, flow, transform, phase)   - ADR-0001 section 4
#   * a filter edge targets the relation the STATEMENT WRITES
#   * join conditions `ON a.x = b.x` are structural, not filter lineage; an equality in a
#     WHERE clause contributes BOTH operands
#   * COUNT(*) and literals produce no value edge - there is no upstream to name
#   * a window function's PARTITION BY / ORDER BY are `influence`, not value and not filter
#     (D-4); its ARGUMENT is a value source
#   * GROUP BY keys `influence` every AGGREGATED output column, never the grouping keys
#     themselves (D-2)
#   * HAVING is a filter with phase `post-aggregation` (D-2)
#   * transform ladder: aggregated > conditional > derived > identity

