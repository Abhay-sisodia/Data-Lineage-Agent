    flow: value
    reason: >
      The ON CONFLICT target read as value lineage. `(cust_id)` decides WHICH row is
      updated; email is what gets written, and matching on one does not make it the source
      of the other. The same error the Oracle key forbids for MERGE's ON condition.

  - source: {kind: column, name: stg_products.category_id}
    target: {kind: column, name: dim_customer_hier.root_name}
    flow: value
    reason: >
      The scalar subquery's own predicate read as its value source. root_name comes from
      MAX(p.product_name); category_id only decides which products are considered.

  - source: {kind: column, name: stg_customer.region}
    target: {kind: column, name: dim_customer_hier.cust_id}
    flow: value
    reason: >
      The self-join's ON condition read as value lineage. `parent.region = child.region`
      pairs the rows; it supplies nothing to either cust_id column.

  - source: {kind: column, name: stg_customer.cust_id}
    target: {kind: column, name: dim_customer_hier.depth}
    flow: value
    reason: >
      depth receives the literal 1. Any source at all for it is invented - and a literal
      column is where an analyser that guesses by position rather than by expression shows
      itself.

# ====================================================================================
# WHAT THIS FILE DECLARES IT CANNOT SEE
#
# NO REFUSALS. Every construct in the source is drawn from the EDGES or NO-SOURCE rows of
# docs/postgres_scope.md, so a refusal appearing here is a FAILURE OF THE SCOPE CONTRACT -
# either the scope claims something it cannot do, or a construct has retreated out of it
# unnoticed. Measured 2026-09-23: zero refusals, contract holds.
#
# ONE BOUNDARY, AND THIS KEY ORIGINALLY SAID ZERO. Filed as PG-02 and corrected here rather
# than argued with. The first draft shipped `expected_boundaries: []` with a note calling
# the empty list "the point of this package"; the analyser declared a schema-context
# boundary and was right to. A refusal and a boundary are different claims - a refusal says
# "this construct is out of scope", a boundary says "this answer is conditional on
# something outside the text" - and only the first is what the scope contract promises
# against. Conflating them is what made the empty list look like a virtue.
# ====================================================================================

expected_boundaries:
  - kind: context_dependent_binding
    subject: "<script>:1"
    reason: >
      Every name in this file is unqualified, and in PostgreSQL what an unqualified name
      resolves to depends on `search_path` at execution time. The lineage here is valid for
      the schema it was bound against - `public`, from the dictionary's default_schema - and
      is a DIFFERENT ANSWER under another. This is the s2 schema-context failure, which
      `docs/postgres_scope.md` already lists under what the scope does not cover, and
      declaring it is the correct behaviour rather than noise to be suppressed.
