# Local Oracle XE for the spike.
#
# This is DEVELOPMENT infrastructure, not product packaging. Phase 0 ships no Docker;
# this container exists so the corpus can actually be compiled and executed, which is
# the only honest way to test three things:
#
#   * T3.3 log recovery - needs a real V$SQL populated by real execution. A synthetic
#     log would contain whatever attribution signals we chose to put in it and would
#     score ~100%, answering nothing.
#   * T1.4 name resolution - needs a real data dictionary, with synonyms that genuinely
#     redirect and views that genuinely hide their base tables.
#   * T3.4 adversarial suite - partition exchange and INSTEAD OF triggers are behaviours,
#     not text patterns. They cannot be asserted against a mock.
#
# Start with:  docker compose up -d
# Then:        .\.venv\Scripts\python.exe scripts\oracle_bootstrap.py

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: lineage-oracle
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    environment:
      # Local development credentials only. Nothing here ever reaches a customer
      # environment - the product never holds database credentials of its own.
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-lineage_sys}
      APP_USER: ${ORACLE_APP_USER:-lineage}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-lineage_app}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      # The image ships its own readiness probe. First start creates the database and
      # takes a few minutes; later starts are quick.
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s

  # The lineage knowledge graph (plan C0-C9). Development infrastructure, like Oracle above.
  # Start alone with:  docker compose up -d neo4j
  # Browser UI:        http://localhost:7474   (user neo4j, password below)
  neo4j:
    image: neo4j:5.26-community
    container_name: lineage-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      # Local development credentials only (see src/lineage/graph/neo4j_conn.py).
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-lineage_graph}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#neo4j/} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  oracle-data:
  neo4j-data:
